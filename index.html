<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>函数图像绘制器</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6bdb">
<meta name="description" content="函数图像、3D 曲面与几何作图三合一">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="函数图像">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='7' fill='%23fff' stroke='%23d6dce6' stroke-width='1.2'/%3E%3Cpath d='M2 16h28M16 2v28' stroke='%2317191d' stroke-width='1.8'/%3E%3Cpath d='M3.5 20c3-12 6.5 8 9.5 1.5s6.2-6 9.6 3' stroke='%232f6bdb' stroke-width='3.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color:#1b1e23;background:#eceef1;-webkit-tap-highlight-color:transparent;
  font-variant-numeric:tabular-nums;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
button{font-family:inherit}
.app{
  --kh:46px;
  position:relative;display:flex;flex-direction:column;
  width:var(--aw,100%);height:var(--ah,100dvh);
  max-width:100%;max-height:100dvh;
  background:#fff;overflow:hidden;user-select:none;
}
.app.is-win{
  border-radius:18px;border:1px solid rgba(15,20,28,.08);
  box-shadow:0 18px 44px rgba(15,22,34,.16),0 2px 6px rgba(15,22,34,.05);
}

/* ---------- 窗口缩放把手 ---------- */
.rz{position:absolute;z-index:50;touch-action:none;display:none}
.app.rz-on .rz{display:block}
.rz-n{top:0;left:16px;right:16px;height:7px;cursor:ns-resize}
.rz-s{bottom:0;left:16px;right:16px;height:7px;cursor:ns-resize}
.rz-w{left:0;top:16px;bottom:16px;width:7px;cursor:ew-resize}
.rz-e{right:0;top:16px;bottom:16px;width:7px;cursor:ew-resize}
.rz-nw{left:0;top:0;width:15px;height:15px;cursor:nwse-resize}
.rz-ne{right:0;top:0;width:15px;height:15px;cursor:nesw-resize}
.rz-sw{left:0;bottom:0;width:15px;height:15px;cursor:nesw-resize}
.rz-se{right:0;bottom:0;width:15px;height:15px;cursor:nwse-resize}
.rz-se::after{
  content:"";position:absolute;right:3px;bottom:3px;width:7px;height:7px;
  border-right:2px solid rgba(47,107,219,.34);border-bottom:2px solid rgba(47,107,219,.34);
  border-radius:0 0 3px 0;
}
.app.rz-on .rz-n:hover,.app.rz-on .rz-s:hover{background:rgba(47,107,219,.1)}
.app.rz-on .rz-w:hover,.app.rz-on .rz-e:hover{background:rgba(47,107,219,.1)}
.app.resizing{user-select:none}

/* ---------- 顶部模式切换 ---------- */
.topbar{
  flex:0 0 auto;display:flex;justify-content:center;align-items:center;
  padding:8px 10px 9px;background:#f1f2f4;border-bottom:1px solid #ebedef;
}
.tabs{display:inline-flex;gap:2px;padding:3px;background:#e7e9eb;border-radius:999px}
.tab{
  border:0;background:transparent;font-size:13.5px;letter-spacing:.01em;
  color:#8b919a;padding:7px 15px;border-radius:999px;cursor:pointer;
  transition:background .16s,color .16s;
}
.tab.is-active{background:#fff;color:#2f6bdb;font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.09)}
.tab:not(.is-active):active{color:#5c626b}

/* ---------- 绘图区 ---------- */
.stage{position:relative;flex:1 1 auto;min-height:132px;background:#fff;overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.app.mode-three #cv{cursor:grab}
.app.mode-geo #cv{cursor:pointer}

.fab{
  position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:10px;
  border:1px solid #e3e5e9;background:#f7f8fa;color:#5b616a;
  display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.05);
}
.fab:active{background:#eceef1}

.zoomctl{
  position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;
  border:1px solid #e3e5e9;border-radius:10px;overflow:hidden;
  background:rgba(247,248,250,.94);box-shadow:0 1px 2px rgba(16,24,40,.05);
}
.zoomctl button{
  width:33px;height:31px;border:0;background:transparent;color:#5b616a;
  cursor:pointer;display:grid;place-items:center;
}
.zoomctl button+button{border-top:1px solid #eceef1}
.zoomctl button:active{background:#eceef1}
.zoomctl svg{width:15px;height:15px}

.caption{
  position:absolute;left:12px;bottom:11px;font-size:11.5px;color:#98a0a9;
  pointer-events:none;max-width:calc(100% - 110px);line-height:1.5;
}

.readout{
  position:absolute;left:10px;top:10px;min-width:104px;
  padding:7px 10px 8px;border:1px solid #e4e6ea;border-radius:9px;
  background:rgba(255,255,255,.96);box-shadow:0 2px 8px rgba(16,24,40,.07);
  font-size:12px;line-height:1.62;pointer-events:none;color:#464c55;
}
.readout .ro-x{font-weight:600;color:#20242a;margin-bottom:2px}
.readout .ro-line{display:flex;align-items:center;gap:6px}
.readout .ro-line i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.readout .ro-line span{white-space:nowrap}

/* ---------- 工具栏 ---------- */
.toolbar{
  flex:0 0 auto;height:47px;display:flex;align-items:center;gap:2px;
  padding:0 6px;background:#f1f2f4;border-top:1px solid #ebeced;
}
.tbtn{
  width:38px;height:38px;border:0;background:transparent;border-radius:9px;
  color:#3f444b;cursor:pointer;display:grid;place-items:center;
}
.tbtn:active{background:#e2e4e8}
.tbtn[disabled]{color:#c4c8cf;cursor:default}
.tbtn[disabled]:active{background:transparent}
.tbtn svg{width:19px;height:19px}
.tbtn.plus{font-size:22px;font-weight:400;line-height:1}
.spacer{flex:1}

/* ---------- 表达式面板 ---------- */
.rows{
  flex:0 0 auto;background:#fff;max-height:32vh;overflow-y:auto;
  border-bottom:1px solid #eceef1;
}
.row{
  display:grid;grid-template-columns:26px 46px minmax(0,1fr);align-items:stretch;
  min-height:54px;background:#fff;border-bottom:1px solid #eff0f2;
  position:relative;transition:background .15s;
}
.row:last-child{border-bottom:0}
.row.is-error{background:#fdf4f3}
.rownum{
  grid-row:1 / -1;display:flex;align-items:flex-start;justify-content:center;
  padding-top:11px;font-size:11.5px;color:#9aa1ab;background:#fbfbfc;
  border-right:1px solid #eff0f2;
}
.swatch{
  grid-row:1 / -1;border:0;padding:9px 0 0;background:#fff;cursor:pointer;
  display:flex;align-items:flex-start;justify-content:center;
}
.badge{
  width:27px;height:27px;border-radius:50%;background:var(--c);color:#fff;
  display:grid;place-items:center;font-size:12px;font-weight:600;
  box-shadow:0 1px 2px rgba(16,24,40,.16);transition:opacity .15s;opacity:.86;
}
.row.is-active .badge{opacity:1}
.badge svg{width:15px;height:15px;stroke:currentColor}
.field{grid-column:3;display:flex;align-items:center;min-width:0;padding-right:2px}
.field.is-active{box-shadow:inset 0 1.5px 0 #2f6bdb,inset 0 -1.5px 0 #2f6bdb}
.row input{
  flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;
  padding:0 6px 0 8px;font-family:inherit;font-size:16.5px;color:#1b1e23;
}
.row input::placeholder{color:#bbc0c8;font-size:15px}
.row .val{font-size:12.5px;color:#868d96;white-space:nowrap;padding-right:4px}
.row .val .veq{margin-right:3px}
.row .lenin{
  width:52px;height:24px;flex:0 0 auto;border:0;border-bottom:1px dashed #cdd2da;
  background:transparent;outline:0;text-align:right;padding:0 2px;
  font-family:inherit;font-size:12.5px;color:#5c636d;
}
.row .lenin:focus{border-bottom-color:#2f6bdb;color:#2f6bdb;background:#f5f8ff}
.row .degin{width:44px}
.row .degsign{font-size:12.5px;color:#868d96}
.shape-list{display:flex;flex-direction:column;gap:8px;margin:8px 0 4px}
.shape-opt{
  display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;
  border:1px solid #e4e7ec;border-radius:10px;background:#fafbfc;cursor:pointer;
  font-family:inherit;text-align:left;
}
.shape-opt b{flex:0 0 auto;font-size:14.5px;font-weight:600;color:#20242a;min-width:78px}
.shape-opt span{font-size:12.5px;color:#8a9099}
.shape-opt.is-on{border-color:#bfd4fb;background:#eff5ff}
.shape-opt.is-on b{color:#2f6bdb}
.shape-opt:active{background:#f0f2f5}
.row .clr{
  width:40px;flex:0 0 40px;border:0;background:transparent;cursor:pointer;
  color:#b7bcc4;display:grid;place-items:center;
}
.row .clr:active{color:#7d838c}
.row .clr svg{width:15px;height:15px}
.row .dombtn{
  flex:0 0 auto;max-width:104px;height:25px;margin-right:2px;padding:0 9px;
  border:1px solid #e2e5ea;border-radius:13px;background:#f6f7f9;color:#8b919a;
  font-family:inherit;font-size:11.5px;font-weight:600;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;
}
.row .dombtn.on{color:#2f6bdb;border-color:#cbdcfa;background:#eef4ff}
.row .dombtn:active{background:#e7eaf0}
.dom-grp{margin-bottom:14px}
.dom-line{display:flex;align-items:center;gap:8px}
.dom-var{width:18px;flex:0 0 18px;font-style:italic;font-size:16px;color:#3a3f47}
.dom-in{
  flex:1;min-width:0;height:40px;border:1px solid #dfe2e8;border-radius:9px;
  padding:0 10px;font-family:inherit;font-size:16px;color:#1b1f26;background:#fff;
}
.dom-in:focus{outline:none;border-color:#2f6bdb;box-shadow:0 0 0 3px rgba(47,107,219,.12)}
.dom-arrow{color:#aeb4bf;font-size:13px}
.dom-flags{display:flex;gap:16px;margin-top:8px;padding-left:26px;font-size:12.5px;color:#7d848d}
.dom-flags label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.dom-tip{margin:2px 0 0;font-size:12.5px;line-height:1.6;color:#8a909b}
.row .sub{
  grid-column:3;display:flex;align-items:center;gap:8px;
  padding:0 8px 9px 8px;margin-top:-4px;
}
.row .sub label{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#7d848d;cursor:pointer}
.row .sub input{width:15px;height:15px;flex:0 0 15px;accent-color:#2f6bdb;margin:0}
.row .sub .gtag{
  font-size:12px;line-height:1.55;color:#5f6670;background:#f4f5f7;
  border-radius:6px;padding:2.5px 8px;white-space:nowrap;
}
.row .sub.circ-sub{flex-wrap:wrap;gap:4px 14px}
.row .sub .circ-row{display:flex;align-items:center;gap:6px}
.row .sub .ceq{font-size:12px;color:#9aa1ab}
.row .sub .cirin{
  width:52px;height:22px;flex:0 0 52px;border:0;border-bottom:1px dashed #cdd2da;
  background:transparent;text-align:right;padding:0 2px;outline:0;
  font-family:inherit;font-size:12px;color:#5c636d;
}
.row .sub .cirin:focus{border-bottom-color:#2f6bdb;color:#2f6bdb;background:#f5f8ff}

/* ---------- 几何工具条 ---------- */
.geobar{
  flex:0 0 auto;display:none;align-items:center;gap:3px;height:46px;
  padding:0 8px;background:#f7f8fa;border-bottom:1px solid #ebedef;
}
.app.mode-geo .geobar{display:flex}
.gtool{
  width:40px;height:36px;border:0;background:transparent;border-radius:8px;
  color:#4a4f57;display:grid;place-items:center;cursor:pointer;
}
.gtool:active{background:#e6e8eb}
.gtool.is-on{background:#dfeafa;color:#2f6bdb}
.gtool svg{width:20px;height:20px}
.gsep{width:1px;height:26px;background:#e4e6ea;margin:0 4px}

/* ---------- 3D 视图切换 ---------- */
.viewctl{position:absolute;right:10px;top:56px;display:none;flex-direction:column;gap:6px}
.app.mode-three .viewctl{display:flex}
.viewctl button{
  width:36px;height:36px;border:1px solid #e3e5e9;border-radius:10px;
  background:rgba(247,248,250,.95);color:#5b616a;display:grid;place-items:center;cursor:pointer;
}
.viewctl button.is-on{background:#fff;color:#2f6bdb;border-color:#c7d9f9}
.viewctl svg{width:18px;height:18px}

.homefab{
  position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:10px;
  border:1px solid #e3e5e9;background:#f7f8fa;color:#5b616a;display:none;
  place-items:center;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.05);
}
.app.mode-geo .homefab{display:grid}
.homefab:active{background:#eceef1}
.homefab svg{width:18px;height:18px}

/* ---------- 3D 方框范围 ---------- */
.rangefab{
  position:absolute;left:10px;top:10px;display:none;align-items:center;gap:5px;
  height:32px;padding:0 10px;border-radius:16px;border:1px solid #e3e5e9;
  background:rgba(247,248,250,.95);color:#5b616a;cursor:pointer;
  font-family:inherit;font-size:12.5px;box-shadow:0 1px 2px rgba(16,24,40,.05);
}
.app.mode-three .rangefab{display:flex}
.rangefab:active{background:#eceef1}
.rangefab svg{width:16px;height:16px}
.rangefab #range-txt{font-weight:600;color:#4c535d}

.stat{
  display:none;align-items:center;gap:4px;height:30px;padding:0 9px;margin:0 2px;
  border:1px solid #e3e5e9;border-radius:15px;background:#f7f8fa;
  font-size:12.5px;color:#5b616a;
}
.app.mode-geo .stat{display:flex}

.errbar{
  flex:0 0 auto;display:none;padding:6px 14px;background:#fdf4f3;color:#c0392b;
  font-size:11.5px;line-height:1.5;border-bottom:1px solid #f2dedb;
}
.errbar.on{display:block}

/* ---------- 键盘 ---------- */
.keyboard{flex:0 0 auto;background:#e9eaec;padding:6px}
.app.mode-geo .keyboard{display:none}
.app.mode-geo.kb-geo .keyboard{display:block}
.app.kb-off .keyboard{display:none}
.kb{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;grid-auto-rows:var(--kh)}
.kb[hidden]{display:none}
.key{
  border:0;background:#fff;color:#4a4f57;font-size:16px;border-radius:8px;
  display:grid;place-items:center;cursor:pointer;padding:0;
  box-shadow:0 1px 0 rgba(16,24,40,.06);
  transition:background .1s,transform .06s;
  min-width:0;
}
.key:active{background:#f3f4f6;transform:scale(.965)}
.key sup{font-size:.6em;vertical-align:super;line-height:0}
.key.fn{background:#d8dade;color:#3c4148;font-size:14px;box-shadow:none}
.key.fn:active{background:#cccfd4}
.key.ret{background:#2f63d9;color:#fff}
.key.ret:active{background:#2756bf}
.key svg{width:19px;height:19px}
.key-nav{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kb-let .key{font-size:15px}

/* ---------- 几何底栏 ---------- */
.geo-bar{
  flex:0 0 auto;display:none;align-items:center;gap:8px;padding:8px 10px 9px;
  background:#f1f2f4;border-top:1px solid #ebeced;
}
.geo-bar .ghint{flex:1;font-size:12px;color:#8b919a;line-height:1.45}
.geo-bar button{
  height:34px;padding:0 13px;border:1px solid #e0e2e6;border-radius:9px;
  background:#fff;color:#4a4f57;font-size:12.5px;cursor:pointer;
}
.geo-bar button:active{background:#f0f1f3}

/* ---------- 弹层 ---------- */
.overlay{
  position:absolute;inset:0;z-index:20;background:rgba(15,20,28,.34);
  display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:opacity .18s;
}
.overlay.on{opacity:1;pointer-events:auto}
.sheet{
  width:100%;max-height:82%;overflow:auto;background:#fff;
  border-radius:16px 16px 0 0;padding:0 0 16px;
  transform:translateY(14px);transition:transform .2s;
}
.overlay.on .sheet{transform:translateY(0)}
.sh-head{
  position:sticky;top:0;background:#fff;display:flex;align-items:center;
  padding:13px 14px 10px;border-bottom:1px solid #f0f1f3;
}
.sh-head h3{margin:0;font-size:15px;font-weight:600;flex:1;color:#20242a}
.sh-close{
  width:32px;height:32px;border:0;background:transparent;color:#9aa0a8;
  cursor:pointer;display:grid;place-items:center;font-size:20px;border-radius:8px;
}
.sh-close:active{background:#f2f3f5}
.sh-body{padding:6px 14px 4px}
.set-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 0;border-bottom:1px solid #f3f4f6;font-size:14px;color:#33383f;
}
.set-row:last-of-type{border-bottom:0}
.set-sel{
  font:inherit;font-size:14px;color:#33383f;background:#f5f6f8;
  border:1px solid #e3e5e9;border-radius:8px;padding:6px 10px;outline:none;
  -webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,#8a9099 50%),linear-gradient(135deg,#8a9099 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
  padding-right:26px;
}
.set-num{
  width:82px;font:inherit;font-size:14px;color:#33383f;background:#f5f6f8;
  border:1px solid #e3e5e9;border-radius:8px;padding:6px 10px;outline:none;text-align:right;
}
.set-num:focus{border-color:#2f6bdb;background:#fff}

/* ---------- 调色盘 ---------- */
.pal-grid{
  display:grid;grid-template-columns:repeat(6,1fr);gap:14px 10px;
  padding:14px 0 6px;justify-items:center;
}
.pal-dot{
  width:34px;height:34px;border-radius:50%;border:0;padding:0;cursor:pointer;
  background:var(--c);box-shadow:0 0 0 1px rgba(16,24,40,.10),0 1px 3px rgba(16,24,40,.14);
}
.pal-dot.is-on{box-shadow:0 0 0 3px #fff,0 0 0 5px #2f6bdb}
.pal-dot:active{transform:scale(.94)}
.switch{position:relative;display:inline-block;width:44px;height:26px;flex:0 0 44px}.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch i{
  position:absolute;inset:0;background:#d5d8dd;border-radius:999px;transition:background .18s;
}
.switch i::after{
  content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.18);transition:transform .18s;
}
.switch input:checked+i{background:#2f6bdb}
.switch input:checked+i::after{transform:translateX(18px)}
.sheet-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.sheet-btns button{
  height:44px;border:1px solid #e0e2e6;border-radius:10px;background:#fff;
  color:#3f444b;font-size:13.5px;cursor:pointer;
}
.sheet-btns button:active{background:#f3f4f6}
.sheet-btns button.wide{grid-column:1 / -1}
.sheet-btns button.danger{color:#c0392b;border-color:#f0dcd9}
.fn-groups{display:flex;flex-direction:column;gap:12px;padding-top:8px}
.fn-group h4{margin:0 0 7px;font-size:12px;color:#8b919a;font-weight:500;letter-spacing:.04em}
.fn-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.fn-grid button{
  height:41px;border:1px solid #e5e7eb;border-radius:9px;background:#fff;
  color:#33383f;font-size:14px;cursor:pointer;
}
.fn-grid button:active{background:#f1f2f4;border-color:#d5d8dd}

/* ---------- Toast ---------- */
.toast{
  position:absolute;left:50%;top:calc(50% + 4px);transform:translate(-50%,-50%) scale(.96);
  background:rgba(28,32,38,.92);color:#fff;font-size:12.5px;
  padding:9px 15px;border-radius:10px;max-width:78%;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:30;
}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* ---------- 桌面端外壳 ---------- */
@media (min-width:720px){
  .app{
    --kh:44px;
    width:var(--aw,486px);height:var(--ah,min(940px,calc(100dvh - 44px)));
    border-radius:24px;overflow:hidden;border:1px solid rgba(15,20,28,.08);

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const COLORS=['#3d7be0','#e0574c','#22a06b','#9254de','#0e9aa8','#e08a1e'];

/* ================= 表达式解析（词法 → 递归下降 → 求值） ================= */
const CONSTS={pi:Math.PI,e:Math.E};
const FUNCS={
  sin:{n:1,f:x=>Math.sin(x)},cos:{n:1,f:x=>Math.cos(x)},tan:{n:1,f:x=>Math.tan(x)},
  cot:{n:1,f:x=>1/Math.tan(x)},sec:{n:1,f:x=>1/Math.cos(x)},csc:{n:1,f:x=>1/Math.sin(x)},
  asin:{n:1,f:x=>Math.asin(x)},acos:{n:1,f:x=>Math.acos(x)},atan:{n:1,f:x=>Math.atan(x)},
  sinh:{n:1,f:x=>Math.sinh(x)},cosh:{n:1,f:x=>Math.cosh(x)},tanh:{n:1,f:x=>Math.tanh(x)},
  sqrt:{n:1,f:x=>Math.sqrt(x)},cbrt:{n:1,f:x=>Math.cbrt(x)},abs:{n:1,f:x=>Math.abs(x)},
  exp:{n:1,f:x=>Math.exp(x)},ln:{n:1,f:x=>Math.log(x)},log:{n:1,f:x=>Math.log10(x)},
  log10:{n:1,f:x=>Math.log10(x)},log2:{n:1,f:x=>Math.log2(x)},
  floor:{n:1,f:x=>Math.floor(x)},ceil:{n:1,f:x=>Math.ceil(x)},round:{n:1,f:x=>Math.round(x)},
  sign:{n:1,f:x=>Math.sign(x)},
  max:{n:'2+',f:(...a)=>Math.max(...a)},min:{n:'2+',f:(...a)=>Math.min(...a)},
  mod:{n:2,f:(a,b)=>((a%b)+b)%b},pow:{n:2,f:(a,b)=>Math.pow(a,b)},atan2:{n:2,f:(a,b)=>Math.atan2(a,b)}
};

function tokenize(input){
  const s=String(input).replace(/\s+/g,'')
    .replace(/π/g,'pi').replace(/×/g,'*').replace(/÷/g,'/')
    .replace(/[−–]/g,'-').replace(/²/g,'^2').replace(/³/g,'^3');
  const tk=[];
  let i=0;
  while(i<s.length){
    const c=s[i];
    if((c>='0'&&c<='9')||c==='.'){
      let j=i,dot=false;
      while(j<s.length&&((s[j]>='0'&&s[j]<='9')||(s[j]==='.'&&!dot))){
        if(s[j]==='.')dot=true;
        j++;
      }
      const v=parseFloat(s.slice(i,j));
      if(!isFinite(v)) throw new Error('数字写法有误');
      tk.push({t:'num',v:v});
      i=j;continue;
    }
    if((c>='a'&&c<='z')||(c>='A'&&c<='Z')){
      let j=i;
      while(j<s.length&&((s[j]>='a'&&s[j]<='z')||(s[j]>='A'&&s[j]<='Z')))j++;
      let w=s.slice(i,j).toLowerCase();
      if(w==='log'&&(s[j]==='1'||s[j]==='2')){
        if(s.substr(j,2)==='10'){w='log10';j+=2;}
        else if(s[j]==='2'){w='log2';j+=1;}
      }
      if(FUNCS[w]||CONSTS[w]) tk.push({t:'id',v:w});
      else if(w==='x'||w==='y') tk.push({t:'id',v:w});
      else{
        let ok=true;
        for(const ch of w){ if(!(FUNCS[ch]||CONSTS[ch]||ch==='x'||ch==='y')){ok=false;break;} }
        if(!ok) throw new Error('无法识别的符号 “'+w+'”');
        for(const ch of w) tk.push({t:'id',v:ch});
      }
      i=j;continue;
    }
    if('+-*/^'.indexOf(c)>=0){ tk.push({t:'op',v:c});i++;continue; }
    if('(),'.indexOf(c)>=0){ tk.push({t:c});i++;continue; }
    if(c==='|'){ tk.push({t:'|'});i++;continue; }
    if(c==='=') throw new Error('等号只写在开头，例如 y=x^2');
    if('<>≤≥'.indexOf(c)>=0) throw new Error('暂不支持不等式，请输入等号表达式');
    throw new Error('无法识别的字符 “'+c+'”');
  }
  if(!tk.length) throw new Error('请输入一个表达式');
  return tk;
}

function parse(input){
  const tk=tokenize(input);
  let p=0;
  const peek=()=>tk[p];
  function expect(ch,msg){
    const x=tk[p];
    if(!x||x.t!==ch) throw new Error(msg||'括号不匹配');
    p++;
  }
  function primary(){
    const x=peek();
    if(!x) throw new Error('表达式不完整');
    if(x.t==='num'){ p++;return {k:'num',v:x.v}; }
    if(x.t==='('){ p++;const n=expr();expect(')','缺少右括号 )');return n; }
    if(x.t==='|'){ p++;const n=expr();expect('|','绝对值缺少结尾的 |');return {k:'fn',name:'abs',args:[n]}; }
    if(x.t==='id'){
      const name=x.v;p++;
      if(FUNCS[name]){
        if(peek()&&peek().t==='('){
          p++;
          const args=[expr()];
          while(peek()&&peek().t===','){ p++;args.push(expr()); }
          expect(')','缺少右括号 )');
          const need=FUNCS[name].n;
          if(typeof need==='number'&&args.length!==need) throw new Error(name+' 需要 '+need+' 个参数');
          if(need==='2+'&&args.length<2) throw new Error(name+' 至少需要 2 个参数');
          return {k:'fn',name:name,args:args};
        }
        throw new Error('“'+name+'” 后面要跟括号，例如 '+name+'(x)');
      }
      if(CONSTS[name]) return {k:'num',v:CONSTS[name]};
      if(name==='x'||name==='y') return {k:'var',name:name};
      throw new Error('未知符号 '+name);
    }
    throw new Error('表达式语法有误');
  }
  function power(){
    const base=primary();
    const x=peek();
    if(x&&x.t==='op'&&x.v==='^'){ p++;return {k:'bin',op:'^',l:base,r:unary()}; }
    return base;
  }
  function unary(){
    const x=peek();
    if(x&&x.t==='op'&&(x.v==='-'||x.v==='+')){
      p++;
      const n=unary();
      return x.v==='-'?{k:'neg',a:n}:n;
    }
    return power();
  }
  function term(){
    let n=unary();
    for(;;){
      const x=peek();
      if(!x) break;
      if(x.t==='op'&&(x.v==='*'||x.v==='/')){
        p++;n={k:'bin',op:x.v,l:n,r:unary()};continue;
      }
      if(x.t==='num'||x.t==='id'||x.t==='('||x.t==='|'){
        n={k:'bin',op:'*',l:n,r:unary()};continue;
      }
      break;
    }
    return n;
  }
  function expr(){
    let n=term();
    for(;;){
      const x=peek();
      if(x&&x.t==='op'&&(x.v==='+'||x.v==='-')){
        p++;n={k:'bin',op:x.v,l:n,r:term()};continue;
      }
      break;
    }
    return n;
  }
  const ast=expr();
  if(p<tk.length) throw new Error('表达式结尾有多余内容');
  return ast;
}

function makeEvaluator(ast){
  function ev(n,v){
    switch(n.k){
      case 'num': return n.v;
      case 'var': return n.name==='x'?v.x:v.y;
      case 'neg': return -ev(n.a,v);
      case 'bin':{
        const a=ev(n.l,v),b=ev(n.r,v);
        if(n.op==='+')return a+b;
        if(n.op==='-')return a-b;
        if(n.op==='*')return a*b;
        if(n.op==='/')return a/b;
        return Math.pow(a,b);
      }
      case 'fn':{
        const args=n.args.map(function(t){return ev(t,v);});
        return FUNCS[n.name].f.apply(null,args);
      }
    }
    return NaN;
  }
  return function(v){ return ev(ast,v); };
}

/* ---- 定义域：从表达式尾部解析 "a<=x<=b" 之类的区间 ---- */
function splitTopComma(s){
  const out=[];let dep=0,cur='';
  for(let i=0;i<s.length;i++){
    const c=s.charAt(i);
    if(c==='(') dep++;
    else if(c===')') dep--;
    if(c===','&&dep===0){ out.push(cur);cur=''; }
    else cur+=c;
  }
  out.push(cur);
  return out;
}
function evalConst(s){
  try{
    const ev=makeEvaluator(parse(String(s).trim()));
    const v=ev({x:0,y:0});
    return (typeof v==='number'&&isFinite(v))?v:null;
  }catch(e){ return null; }
}
function parseRangeSeg(seg,V){
  const g=String(seg||'').trim();
  if(!g) return null;
  let m=g.match(new RegExp('^(.+?)\\s*(<=|≤|<)\\s*'+V+'\\s*(<=|≤|<)\\s*(.+)$'));
  if(m){
    const a=evalConst(m[1]),b=evalConst(m[4]);
    if(a!==null&&b!==null){
      return {lo:Math.min(a,b),hi:Math.max(a,b),loOpen:m[2]==='<',hiOpen:m[3]==='<'};
    }
  }
  m=g.match(new RegExp('^'+V+'\\s*(>=|≥|>)\\s*(.+)$'));
  if(m){
    const v=evalConst(m[2]);
    if(v!==null) return {lo:v,loOpen:(m[1]==='>')};
  }
  m=g.match(new RegExp('^'+V+'\\s*(<=|≤|<)\\s*(.+)$'));
  if(m){
    const v=evalConst(m[2]);
    if(v!==null) return {hi:v,hiOpen:(m[1]==='<')};
  }
  m=g.match(new RegExp('^(.+?)\\s*(<=|≤|<)\\s*'+V+'\\s*$'));
  if(m){
    const v=evalConst(m[1]);
    if(v!==null) return {lo:v,loOpen:(m[2]==='<')};
  }
  return null;
}
function parseDomain(text,mode){
  const parts=splitTopComma(text);
  const keep=[parts[0]];
  const dom={};
  for(let i=1;i<parts.length;i++){
    const seg=parts[i];
    const rx=parseRangeSeg(seg,'x');
    if(rx){
      if(typeof rx.lo==='number'&&dom.xLo===undefined){ dom.xLo=rx.lo;dom.xLoOpen=!!rx.loOpen; }
      if(typeof rx.hi==='number'&&dom.xHi===undefined){ dom.xHi=rx.hi;dom.xHiOpen=!!rx.hiOpen; }
      continue;
    }
    if(mode==='three'){
      const ry=parseRangeSeg(seg,'y');
      if(ry){
        if(typeof ry.lo==='number'&&dom.yLo===undefined){ dom.yLo=ry.lo;dom.yLoOpen=!!ry.loOpen; }
        if(typeof ry.hi==='number'&&dom.yHi===undefined){ dom.yHi=ry.hi;dom.yHiOpen=!!ry.hiOpen; }
        continue;
      }
    }
    keep.push(seg);
  }
  const has=(dom.xLo!==undefined||dom.xHi!==undefined||dom.yLo!==undefined||dom.yHi!==undefined);
  return {body:keep.join(',').trim(),dom:has?dom:null};
}

function compileText(text,mode){
  let t=String(text||'').trim();
  if(mode==='three') t=t.replace(/^(z|f\s*\(\s*x\s*,\s*y\s*\))\s*=\s*/i,'');
  else t=t.replace(/^y\s*=\s*/i,'');
  if(!t) return {empty:true};
  const pd=parseDomain(t,mode);
  if(!pd.body) return {empty:true,dom:pd.dom};
  try{
    const ast=parse(pd.body);
    return {fn:makeEvaluator(ast),dom:pd.dom,body:pd.body};
  }catch(e){
    return {err:e.message,dom:pd.dom,body:pd.body};
  }
}

/* ================= 状态 ================= */
const app=$('#app'), cv=$('#cv'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,userView=false;

const S={
  tab:'func',
  exprs:[{id:1,text:'',color:COLORS[0],fn:null,err:null}],
  activeId:1,
  view:{cx:0,cy:0,unit:34},
  showGrid:true,showLabels:true,trace:true,
  kbVisible:true,kbMode:'num',sound:false,
  dec:2,
  geo:{objs:[],tool:'select',pend:[],sel:null,drag:null,detail:false,shape:'poly',pbase:null},
  three:{az:-0.62,pitch:0.6,scale:1,view:'3d',rx:5,ry:5,rz:5},
  hover:null
};
try{
  const dv=parseInt(localStorage.getItem('fnplot.dec'),10);
  if(dv>=0&&dv<=4) S.dec=dv;
}catch(err){}
const GDOT=['#3d7be0','#22a06b','#9254de','#e0574c','#0e9aa8','#e08a1e'];
const GSHAPE=['#e0574c','#3d7be0','#22a06b','#e08a1e','#0e9aa8','#9254de'];

/* ================= 坐标换算 ================= */
function worldX(px){ return S.view.cx+(px-W/2)/S.view.unit; }
function worldY(py){ return S.view.cy-(py-H/2)/S.view.unit; }
function toX(wx){ return W/2+(wx-S.view.cx)*S.view.unit; }
function toY(wy){ return H/2-(wy-S.view.cy)*S.view.unit; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

function niceStep(min){
  if(!isFinite(min)||min<=0) return 1;
  const p=Math.pow(10,Math.floor(Math.log10(min)));
  const m=min/p;
  const n=m<=1?1:m<=2?2:m<=5?5:10;
  return n*p;
}
function decimalsOf(step){
  let d=0,s=step;
  while(s<1-1e-9&&d<6){ s*=10;d++; }
  return d;
}
function pickLabelStep(unit,halfH){
  const cand=[];
  for(let k=-4;k<=4;k++){
    [1,2,5].forEach(function(m){ cand.push(m*Math.pow(10,k)); });
  }
  cand.sort(function(a,b){ return a-b; });
  const minPx=54/unit;
  for(let i=0;i<cand.length;i++){
    const st=cand[i];
    if(st<minPx-1e-9) continue;
    if(halfH/st>=1.15) return st;
  }
  return niceStep(minPx);
}
function fmt(v,step){
  if(Math.abs(v)<step*1e-6) v=0;
  if(Math.abs(v)>=1e5) return v.toExponential(1).replace('+','');
  let s=step,d=0;
  while(s<1-1e-9&&d<6){ s*=10;d++; }
  let str=v.toFixed(Math.min(d,6));
  if(str.indexOf('.')>=0) str=str.replace(/0+$/,'').replace(/\.$/,'');
  if(str==='-0') str='0';
  return str;
}
function fmtNum(v,digits){
  if(!isFinite(v)) return '—';
  if(Math.abs(v)>=1e6) return v.toExponential(2).replace('+','');
  const d=digits===undefined?3:digits;
  let s=v.toFixed(d);
  if(s.indexOf('.')>=0) s=s.replace(/0+$/,'').replace(/\.$/,'');
  if(s==='-0') s='0';
  return s;
}
/* 坐标显示的小数位数（可在设置中改） */
function dg(){
  const d=typeof S.dec==='number'?S.dec:2;
  return clamp(Math.round(d),0,4);
}
/* 固定位数的坐标文字：保留 0 位时不带小数点 */
function dnum(v){
  const d=dg();
  if(!isFinite(v)) return '—';
  let s=v.toFixed(d);
  if(s==='-0'||s==='-0.0') s=(0).toFixed(d);
  return s;
}
/* 长度、面积等量：固定两位 */
function len2(v){
  if(!isFinite(v)) return '—';
  let s=v.toFixed(2);
  if(s==='-0.00') s='0.00';
  return s;
}
function lerpColor(c1,c2,t){
  return 'rgb('+Math.round(c1[0]+(c2[0]-c1[0])*t)+','+
         Math.round(c1[1]+(c2[1]-c1[1])*t)+','+
         Math.round(c1[2]+(c2[2]-c1[2])*t)+')';
}
function heightColor(t){
  const A=[46,92,140],B=[110,162,186],C=[224,152,88];
  t=clamp(t,0,1);
  return t<0.5?lerpColor(A,B,t*2):lerpColor(B,C,(t-0.5)*2);
}

/* ================= 画布尺寸 ================= */
function fitUnit(){
  return Math.max(W/22,H/13.5);
}
function syncSize(){
  const r=cv.getBoundingClientRect();
  const w=Math.max(1,Math.round(r.width));
  const h=Math.max(1,Math.round(r.height));
  const dpr=Math.min(3,window.devicePixelRatio||1);
  if(w===W&&h===H&&Math.round(w*dpr)===cv.width&&Math.round(h*dpr)===cv.height) return false;
  W=w;H=h;DPR=dpr;
  cv.width=Math.round(w*DPR);
  cv.height=Math.round(h*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  return true;
}
function resize(){ syncSize(); }
function resetView(){
  S.view.cx=0;S.view.cy=0;S.view.unit=fitUnit();
  userView=false;
  requestDraw();
}
function zoomAt(px,py,factor){
  const wx=worldX(px),wy=worldY(py);
  S.view.unit=clamp(S.view.unit*factor,1.2,80000);
  S.view.cx=wx-(px-W/2)/S.view.unit;
  S.view.cy=wy+(py-H/2)/S.view.unit;
  userView=true;
  requestDraw();
}

/* ================= 绘制 ================= */
let drawing=false;
function requestDraw(){
  if(drawing) return;
  drawing=true;
  try{ draw(); }catch(err){ if(window.console) console.error(err); }
  drawing=false;
}

function draw(){
  if(syncSize()&&!userView){
    S.view.cx=0;S.view.cy=0;
    S.view.unit=fitUnit();
  }
  if(!W||!H) return;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#fff';
  ctx.fillRect(0,0,W,H);
  if(S.tab==='three'){ drawThree(); return; }
  drawGrid();
  if(S.tab==='geo'){ drawGeo(); return; }
  let painted=false;
  S.exprs.forEach(function(ex){
    if(ex.fn&&String(ex.text||'').trim()){ drawCurve(ex); painted=true; }
  });
  if(!painted) drawHintText('在下方输入表达式，图像会显示在这里','例如 sin(x)、x^2、abs(x)、sqrt(x)');
  drawTrace();
}

function drawHintText(main,sub){
  ctx.save();
  ctx.textAlign='center';
  const cy=Math.max(48,H*0.17);
  const f1='13.5px -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
  const f2='12px -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
  ctx.font=f1;
  const w1=ctx.measureText(main).width;
  ctx.font=f2;
  const w2=sub?ctx.measureText(sub).width:0;
  const bw=Math.min(W-24,Math.max(w1,w2)+30);
  const bh=sub?58:34;
  ctx.fillStyle='#fff';
  ctx.strokeStyle='#ebedf1';
  ctx.lineWidth=1;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(W/2-bw/2,cy-21,bw,bh,11);
  else ctx.rect(W/2-bw/2,cy-21,bw,bh);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle='#959ca5';
  ctx.font=f1;
  ctx.fillText(main,W/2,cy);
  if(sub){
    ctx.fillStyle='#b0b6be';
    ctx.font=f2;
    ctx.fillText(sub,W/2,cy+21);
  }
  ctx.restore();
}

function drawGrid(){
  const u=S.view.unit;
  const x0=worldX(0),x1=worldX(W),y0=worldY(H),y1=worldY(0);
  const minor=niceStep(26/u),major=pickLabelStep(u,H/2/u);
  ctx.lineWidth=1;
  if(S.showGrid){
    ctx.strokeStyle='#e9ebef';
    ctx.beginPath();
    for(let i=Math.ceil(x0/minor);i*minor<=x1;i++){
      const x=Math.round(toX(i*minor))+0.5;
      ctx.moveTo(x,0);ctx.lineTo(x,H);
    }
    for(let j=Math.ceil(y0/minor);j*minor<=y1;j++){
      const y=Math.round(toY(j*minor))+0.5;
      ctx.moveTo(0,y);ctx.lineTo(W,y);
    }
    ctx.stroke();
    ctx.strokeStyle='#dfe2e8';
    ctx.beginPath();
    for(let i=Math.ceil(x0/major);i*major<=x1;i++){
      const x=Math.round(toX(i*major))+0.5;
      ctx.moveTo(x,0);ctx.lineTo(x,H);
    }
    for(let j=Math.ceil(y0/major);j*major<=y1;j++){
      const y=Math.round(toY(j*major))+0.5;
      ctx.moveTo(0,y);ctx.lineTo(W,y);
    }
    ctx.stroke();
  }
  const ax=toX(0),ay=toY(0);
  ctx.strokeStyle='#17191d';
  ctx.lineWidth=1.9;
  ctx.beginPath();
  if(ay>=-1&&ay<=H+1){ ctx.moveTo(0,Math.round(ay)+0.5);ctx.lineTo(W,Math.round(ay)+0.5); }
  if(ax>=-1&&ax<=W+1){ ctx.moveTo(Math.round(ax)+0.5,0);ctx.lineTo(Math.round(ax)+0.5,H); }
  ctx.stroke();
  if(S.showLabels) drawTicks(major,ax,ay,x0,x1,y0,y1);
}

function drawTicks(step,ax,ay,x0,x1,y0,y1){
  const d=decimalsOf(step);
  ctx.save();
  ctx.font='500 12px -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle='#5f656e';
  const labelY=clamp(ay,6,H-30);
  const labelX=clamp(ax,34,W-8);
  ctx.textAlign='center';
  ctx.textBaseline='top';
  for(let i=Math.ceil(x0/step);i*step<=x1;i++){
    const v=i*step,px=toX(v);
    if(px<12||px>W-12) continue;
    if(Math.abs(v)<step*1e-6) continue;
    ctx.fillText(fmt(v,step),px,labelY+5);
  }
  if(ax>18&&ax<W-14&&ay>-6&&ay<H-16){
    ctx.textAlign='right';
    ctx.fillText('0',ax-6,ay+5);
  }
  ctx.textAlign='right';
  ctx.textBaseline='middle';
  for(let j=Math.ceil(y0/step);j*step<=y1;j++){
    const v=j*step,py=toY(v);
    if(py<10||py>H-10) continue;
    if(Math.abs(v)<step*1e-6) continue;
    ctx.fillText(fmt(v,step),labelX-6,py);
  }
  ctx.restore();
}

function drawCurve(ex){
  const f=ex.fn;
  const vars={x:0,y:0};
  const limit=Math.max(H*6,4000);
  const d=ex.dom||{};
  const xLo=(typeof d.xLo==='number')?d.xLo:null;
  const xHi=(typeof d.xHi==='number')?d.xHi:null;
  let px0=0,px1=W;
  if(xLo!==null) px0=Math.max(0,toX(xLo));
  if(xHi!==null) px1=Math.min(W,toX(xHi));
  if(px1<=px0-0.5) return;
  let started=false,prev=null;
  ctx.strokeStyle=ex.color;
  ctx.lineWidth=2;
  ctx.lineJoin='round';
  ctx.lineCap='round';
  ctx.beginPath();
  const list=[];
  for(let px=px0;px<=px1;px+=1) list.push(px);
  if(list.length===0||px1-list[list.length-1]>0.4) list.push(px1);
  list.forEach(function(px){
    vars.x=worldX(px);
    let y;
    try{ y=f(vars); }catch(e){ y=NaN; }
    const py=(typeof y==='number'&&isFinite(y))?toY(y):NaN;
    if(!isFinite(py)||Math.abs(py)>limit){ started=false;prev=null;return; }
    if(!started){ ctx.moveTo(px,py);started=true; }
    else if(prev!==null&&Math.abs(py-prev)>H*2.4){ ctx.moveTo(px,py); }
    else{ ctx.lineTo(px,py); }
    prev=py;
  });
  ctx.stroke();
  // 区间端点：实心=包含，空心=不包含
  const ends=[];
  if(xLo!==null) ends.push([xLo,!!d.xLoOpen]);
  if(xHi!==null) ends.push([xHi,!!d.xHiOpen]);
  ends.forEach(function(e){
    const v=e[0],open=e[1];
    const px=toX(v);
    if(px<-3||px>W+3) return;
    vars.x=v;
    let y;
    try{ y=f(vars); }catch(err){ return; }
    if(typeof y!=='number'||!isFinite(y)) return;
    const py=toY(y);
    if(py<-24||py>H+24) return;
    ctx.beginPath();
    ctx.arc(px,py,4,0,Math.PI*2);
    if(open){ ctx.strokeStyle=ex.color;ctx.lineWidth=2;ctx.stroke(); }
    else{ ctx.fillStyle=ex.color;ctx.fill(); }
  });
}

function drawTrace(){
  if(!S.trace||!S.hover||S.tab!=='func') return;
  const px=clamp(S.hover.px,0,W);
  ctx.save();
  ctx.setLineDash([4,4]);
  ctx.lineWidth=1;
  ctx.strokeStyle='#c9ced7';
  ctx.beginPath();
  ctx.moveTo(px,0);ctx.lineTo(px,H);
  ctx.stroke();
  ctx.restore();
  const vars={x:worldX(px),y:0};
  S.exprs.forEach(function(ex){
    if(!ex.fn||!String(ex.text||'').trim()) return;
    const d=ex.dom||{};
    if(typeof d.xLo==='number'&&vars.x<d.xLo-1e-9) return;
    if(typeof d.xHi==='number'&&vars.x>d.xHi+1e-9) return;
    let y;
    try{ y=ex.fn(vars); }catch(e){ return; }
    if(!isFinite(y)) return;
    const py=toY(y);
    if(py<-30||py>H+30) return;
    ctx.beginPath();
    ctx.arc(px,py,3.6,0,Math.PI*2);
    ctx.fillStyle=ex.color;
    ctx.fill();
    ctx.strokeStyle='#fff';
    ctx.lineWidth=1.4;
    ctx.stroke();
  });
}

/* ================= 3D 曲面 ================= */
function rgbaOf(hex,a){
  const h=String(hex).replace('#','');
  const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}
function drawThree(){
  const RX=S.three.rx||5,RZ=S.three.rz||5,RY=S.three.ry||5;
  const az=S.three.az,pitch=S.three.pitch,scale=S.three.scale;
  const ca=Math.cos(az),sa=Math.sin(az),cp=Math.cos(pitch),sp=Math.sin(pitch);
  const halfW=Math.max(0.5,RX*Math.abs(ca)+RY*Math.abs(sa));
  const ix=RX*Math.abs(sa)+RY*Math.abs(ca);
  const halfH=Math.max(0.5,ix*sp+RZ*cp);
  const base=Math.min(W*1.52/halfW,H*0.46/halfH)*scale;
  const cx0=W/2,cy0=H*0.50;
  function proj(x,y,zz){
    const xr=x*ca-y*sa, yr=x*sa+y*ca;
    return {x:cx0+xr*base, y:cy0+(yr*sp-zz*cp)*base, d:yr*cp-zz*sp};
  }

  // 立方体线框
  const V=[];
  for(let i=0;i<8;i++) V.push([(i&1?RX:-RX),(i&2?RY:-RY),(i&4?RZ:-RZ)]);
  const E=[];
  for(let i=0;i<8;i++) for(let b=0;b<3;b++){ const j=i^(1<<b); if(j>i) E.push([i,j]); }
  E.forEach(function(e){
    const p1=proj(V[e[0]][0],V[e[0]][1],V[e[0]][2]);
    const p2=proj(V[e[1]][0],V[e[1]][1],V[e[1]][2]);
    const back=(p1.d+p2.d)/2>0;
    ctx.strokeStyle=back?'rgba(122,132,148,.20)':'rgba(96,106,122,.42)';
    ctx.lineWidth=back?0.9:1.25;
    ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
  });

  // 曲面
  const ex=S.exprs.filter(function(e){ return e.fn&&String(e.text||'').trim(); })[0];
  if(ex){
    const d=ex.dom||{};
    let xa=-RX,xb=RX,ya=-RY,yb=RY;
    if(typeof d.xLo==='number') xa=Math.max(-RX,d.xLo);
    if(typeof d.xHi==='number') xb=Math.min(RX,d.xHi);
    if(typeof d.yLo==='number') ya=Math.max(-RY,d.yLo);
    if(typeof d.yHi==='number') yb=Math.min(RY,d.yHi);
    if(xb<=xa||yb<=ya){
      drawHintText('定义域不在方框范围内','把 x 的范围调在 -'+fmtNum(RX,1)+' 到 '+fmtNum(RX,1)+' 之间');
      return;
    }
    const N=32,sx=(xb-xa)/N,sy=(yb-ya)/N,size=N+1;
    const zs=new Float64Array(size*size);
    const vars={x:0,y:0};
    let ok=0;
    for(let i=0;i<size;i++) for(let j=0;j<size;j++){
      vars.x=xa+i*sx;vars.y=ya+j*sy;
      let v;
      try{ v=ex.fn(vars); }catch(err){ v=NaN; }
      if(typeof v==='number'&&isFinite(v)){ zs[i*size+j]=v; ok++; }
      else zs[i*size+j]=NaN;
    }
    if(ok>10){
      const lim=RZ*1.02;
      const cells=[];
      for(let i=0;i<N;i++) for(let j=0;j<N;j++){
        const z00=zs[i*size+j],z10=zs[(i+1)*size+j],z01=zs[i*size+j+1],z11=zs[(i+1)*size+j+1];
        if(!(Math.abs(z00)<=lim&&Math.abs(z10)<=lim&&Math.abs(z01)<=lim&&Math.abs(z11)<=lim)) continue;
        const x0=xa+i*sx,x1=x0+sx,y0=ya+j*sy,y1=y0+sy;
        const p00=proj(x0,y0,z00),p10=proj(x1,y0,z10),p11=proj(x1,y1,z11),p01=proj(x0,y1,z01);
        const fx=(z10-z00)/sx,fy=(z01-z00)/sy;
        let nx=-fx,ny=-fy,nz=1;
        const nl=Math.sqrt(nx*nx+ny*ny+nz*nz);
        nx/=nl;ny/=nl;nz/=nl;
        let li=Math.abs(nx*(-0.34)+ny*(-0.52)+nz*0.78);
        li=clamp(li,0,1);
        cells.push({d:(p00.d+p10.d+p11.d+p01.d)/4,ps:[p00,p10,p11,p01],li:li});
      }
      cells.sort(function(a,b){ return b.d-a.d; });
      cells.forEach(function(c){
        const k=c.li;
        ctx.beginPath();
        ctx.moveTo(c.ps[0].x,c.ps[0].y);
        ctx.lineTo(c.ps[1].x,c.ps[1].y);
        ctx.lineTo(c.ps[2].x,c.ps[2].y);
        ctx.lineTo(c.ps[3].x,c.ps[3].y);
        ctx.closePath();
        ctx.fillStyle='rgba('+Math.round(146+86*k)+','+Math.round(20+34*k)+','+Math.round(22+30*k)+',.94)';
        ctx.fill();
        ctx.strokeStyle='rgba(118,16,18,.42)';
        ctx.lineWidth=0.7;
        ctx.stroke();
      });
      // 定义域边界：曲面边缘虚线
      if(typeof d.xLo==='number'||typeof d.xHi==='number'||typeof d.yLo==='number'||typeof d.yHi==='number'){
        ctx.save();
        ctx.setLineDash([5,4]);
        ctx.strokeStyle='rgba(60,70,85,.42)';
        ctx.lineWidth=1;
        const bx=xa,by=ya,bw=xb-xa,bh=yb-ya;
        [[bx,by],[xb,by],[xb,yb],[bx,yb]].forEach(function(p,i,arr){
          const q=arr[(i+1)%4];
          const z1=(function(){try{const v=ex.fn({x:p[0],y:p[1]});return isFinite(v)?v:0;}catch(e){return 0;}})();
          const z2=(function(){try{const v=ex.fn({x:q[0],y:q[1]});return isFinite(v)?v:0;}catch(e){return 0;}})();
          const a1=proj(p[0],p[1],z1),a2=proj(q[0],q[1],z2);
          ctx.beginPath();ctx.moveTo(a1.x,a1.y);ctx.lineTo(a2.x,a2.y);ctx.stroke();
        });
        ctx.restore();
      }
    }else{
      drawHintText('该表达式在所选范围内没有有效取值','换个表达式或调整范围试试');
    }
  }else{
    drawHintText('输入形如 sin(x)*cos(y) 的曲面表达式','拖动可旋转，滚轮缩放');
  }

  // 坐标轴
  const O=proj(0,0,0);
  ctx.lineCap='butt';
  function seg(a,b,color,w){
    ctx.strokeStyle=color;ctx.lineWidth=w;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
  function arrow(a,b,color){
    const dx=b.x-a.x,dy=b.y-a.y,L=Math.sqrt(dx*dx+dy*dy)||1;
    const ux=dx/L,uy=dy/L,px=-uy,py=ux;
    const s=6.2;
    ctx.beginPath();
    ctx.moveTo(b.x,b.y);
    ctx.lineTo(b.x-ux*s+px*s*0.42,b.y-uy*s+py*s*0.42);
    ctx.lineTo(b.x-ux*s-px*s*0.42,b.y-uy*s-py*s*0.42);
    ctx.closePath();
    ctx.fillStyle=color;ctx.fill();
  }
  const AX='#5d6570';
  [[1,0,0,'x',RX],[0,1,0,'y',RY],[0,0,1,'z',RZ]].forEach(function(v){
    const end=proj(v[0]*v[4]*1.06,v[1]*v[4]*1.06,v[2]*v[4]*1.06);
    seg(O,end,AX,1.3);
    arrow(O,end,AX);
    ctx.font='600 12px -apple-system,"Segoe UI","PingFang SC",sans-serif';
    ctx.fillStyle=AX;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(v[3],end.x+(v[3]==='z'?10:end.x>cx0?13:-13),end.y+(v[3]==='z'?-10:0));
  });
  seg(O,proj(0,0,-RZ*1.02),'rgba(93,101,112,.55)',1.1);
  // z 轴刻度
  ctx.font='500 10.5px -apple-system,"Segoe UI","PingFang SC",sans-serif';
  ctx.fillStyle='#6f7681';
  [[RZ,fmtNum(RZ,1)],[-RZ,'-'+fmtNum(RZ,1)]].forEach(function(t){
    const p=proj(0,0,t[0]);
    ctx.strokeStyle='rgba(93,101,112,.6)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(p.x-3.5,p.y);ctx.lineTo(p.x+3.5,p.y);ctx.stroke();
    ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillText(t[1],p.x+6,p.y);
  });
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  updateRangeFab();
}

/* ================= 几何引擎 ================= */
function geoNextName(){
  const used={};
  S.geo.objs.forEach(function(o){ if(o.type==='point') used[o.name]=1; });
  for(let i=0;i<26;i++){ const n=String.fromCharCode(65+i); if(!used[n]) return n; }
  let k=1; while(used['P'+k]) k++;
  return 'P'+k;
}
function geoExById(id){
  for(let i=0;i<S.exprs.length;i++){ if(S.exprs[i].id===id) return S.exprs[i]; }
  return null;
}
function geoSolve(){
  const pts={};
  S.geo.objs.forEach(function(o){
    if(o.type==='point'&&!o.dep&&!o.on) pts[o.name]={x:o.x,y:o.y};
  });
  for(let pass=0;pass<5;pass++){
    S.geo.objs.forEach(function(o){
      if(o.type!=='point'||pts[o.name]) return;
      if(o.dep&&o.dep.k==='mid'){
        const a=pts[o.dep.a],b=pts[o.dep.b];
        if(a&&b) pts[o.name]={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
        return;
      }
      if(o.on){
        if(o.on.k==='seg'){
          const a=pts[o.on.a],b=pts[o.on.b];
          if(a&&b){
            const t=clamp(o.t==null?0.5:o.t,0,1);
            pts[o.name]={x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t};
          }
        }else if(o.on.k==='circ'){
          const c0=pts[o.on.c],r0=pts[o.on.p];
          if(c0&&r0){
            const r=Math.sqrt((r0.x-c0.x)*(r0.x-c0.x)+(r0.y-c0.y)*(r0.y-c0.y));
            const ang=(typeof o.on.ang==='number')?o.on.ang:0;
            pts[o.name]={x:c0.x+r*Math.cos(ang),y:c0.y+r*Math.sin(ang)};
          }
        }else if(o.on.k==='curve'){
          const ex=geoExById(o.on.id);
          if(ex&&ex.fn){
            const xv=(typeof o.on.x==='number')?o.on.x:0;
            let y;
            try{ y=ex.fn({x:xv,y:0}); }catch(err){ y=NaN; }
            if(typeof y==='number'&&isFinite(y)) pts[o.name]={x:xv,y:y};
          }
        }
      }
    });
  }
  // 垂线 / 平行线：用第二个端点动态算出方向点（不额外生成可见的点）
  S.geo.objs.forEach(function(o){
    if(o.type!=='line'||!o.dep) return;
    const p=pts[o.dep.pt],A=pts[o.dep.a],B=pts[o.dep.b];
    if(!p||!A||!B) return;
    let dx=B.x-A.x,dy=B.y-A.y;
    const L=Math.sqrt(dx*dx+dy*dy)||1;
    dx/=L;dy/=L;
    if(o.dep.k==='perp'){ const t=dx; dx=-dy; dy=t; }
    const len=(typeof o.dep.len==='number'&&o.dep.len>1e-9)?o.dep.len:Math.max(L,2);
    pts[o.b]={x:p.x+dx*len,y:p.y+dy*len};
  });
  return pts;
}
function hasGeoCurves(){
  return S.exprs.some(function(e){ return e.fn&&String(e.text||'').trim(); });
}
function geoHitPoint(p){
  const pts=geoSolve();
  let best=null,bd=24;
  S.geo.objs.forEach(function(o){
    if(o.type!=='point') return;
    const q=pts[o.name];
    if(!q) return;
    const px=toX(q.x),py=toY(q.y);
    const d=Math.sqrt((px-p.x)*(px-p.x)+(py-p.y)*(py-p.y));
    if(d<bd){ bd=d;best=o.name; }
  });
  return best;
}
function geoDist2Seg(p,a,b){
  const ax=toX(a.x),ay=toY(a.y),bx=toX(b.x),by=toY(b.y);
  const dx=bx-ax,dy=by-ay;
  const L=dx*dx+dy*dy||1;
  let t=((p.x-ax)*dx+(p.y-ay)*dy)/L;
  t=clamp(t,0,1);
  const qx=ax+t*dx,qy=ay+t*dy;
  return Math.sqrt((p.x-qx)*(p.x-qx)+(p.y-qy)*(p.y-qy));
}

function normGeoText(text){
  return String(text==null?'':text)
    .replace(/[−–—]/g,'-')
    .replace(/[，、]/g,',')
    .replace(/（/g,'(').replace(/）/g,')')
    .replace(/＝/g,'=')
    .replace(/：/g,':')
    .replace(/　/g,' ')
    .replace(/[\u200b-\u200f\u00a0]/g,'')
    .trim();
}
function parseGeoDef(text){
  const t=normGeoText(text);
  if(!t) return null;
  const num='([-+]?(?:\\d+(?:\\.\\d*)?|\\.\\d+))';
  let m;
  m=t.match(new RegExp('^([A-Za-z]\\w*)\\s*=\\s*\\(?\\s*'+num+'\\s*,\\s*'+num+'\\s*\\)?$'));
  if(m) return {type:'point',name:m[1].toUpperCase(),x:parseFloat(m[2]),y:parseFloat(m[3]),refs:[]};
  m=t.match(new RegExp('^\\(?\\s*'+num+'\\s*,\\s*'+num+'\\s*\\)?$'));
  if(m) return {type:'point',x:parseFloat(m[1]),y:parseFloat(m[2]),refs:[]};
  m=t.match(/^([A-Za-z]\w*)\s*=\s*on\s*\(\s*(.+?)\s*\)?$/i);
  if(m){
    const arg=m[2].trim();
    const sm=arg.match(/^(segment|line)\s*\(\s*([^()]+?)\s*\)$/i);
    if(sm){
      const args=sm[2].split(',').map(function(s){ return s.trim(); }).filter(Boolean);
      if(args.length===2) return {type:'point',name:m[1].toUpperCase(),on:{k:'seg',a:args[0],b:args[1]},refs:args,t:0.5};
    }
    const cm=arg.match(/^circle\s*\(\s*([^()]+?)\s*\)$/i);
    if(cm){
      const cargs=cm[1].split(',').map(function(s){ return s.trim(); }).filter(Boolean);
      if(cargs.length===2) return {type:'point',name:m[1].toUpperCase(),on:{k:'circ',c:cargs[0],p:cargs[1]},refs:cargs,ang:0};
    }
    return {type:'point',name:m[1].toUpperCase(),on:{k:'curve',ref:arg},refs:[]};
  }
  // 线段/直线的中文简写：线段 AB、直线 AB、AB
  m=t.match(/^线段\s*([A-Za-z])\s*([A-Za-z])$/);
  if(m) return {type:'segment',a:m[1].toUpperCase(),b:m[2].toUpperCase(),refs:[m[1].toUpperCase(),m[2].toUpperCase()]};
  m=t.match(/^直线\s*([A-Za-z])\s*([A-Za-z])$/);
  if(m) return {type:'line',a:m[1].toUpperCase(),b:m[2].toUpperCase(),refs:[m[1].toUpperCase(),m[2].toUpperCase()]};
  // 圆的中文简写：圆 BC、圆(B,C)
  m=t.match(/^圆\s*\(?\s*([A-Za-z])\s*,\s*([A-Za-z])\s*\)?$/);
  if(m) return {type:'circle',c:m[1].toUpperCase(),p:m[2].toUpperCase(),refs:[m[1].toUpperCase(),m[2].toUpperCase()]};
  m=t.match(/^圆\s*([A-Za-z])\s*([A-Za-z])$/);
  if(m) return {type:'circle',c:m[1].toUpperCase(),p:m[2].toUpperCase(),refs:[m[1].toUpperCase(),m[2].toUpperCase()]};
  m=t.match(/^([A-Z])\s?([A-Z])$/);
  if(m&&m[1]!==m[2]) return {type:'segment',a:m[1],b:m[2],refs:[m[1],m[2]]};
  // 多边形中文简写：多边形 ABCD、多边形(A,B,C,D)、ABCD
  m=t.match(/^多边形\s*\(?(.*?)\)?$/);
  if(m){
    const ls=(m[1].match(/[A-Za-z]/g)||[]).map(function(s){ return s.toUpperCase(); });
    if(ls.length>=3) return {type:'polygon',pts:ls,refs:ls};
  }
  // 角：角 ABC、角(A,B,C)
  m=t.match(/^角\s*\(?(.*?)\)?$/);
  if(m){
    const ls=(m[1].match(/[A-Za-z]/g)||[]).map(function(s){ return s.toUpperCase(); });
    if(ls.length===3) return {type:'angle',a:ls[0],v:ls[1],b:ls[2],refs:ls};
  }
  m=t.match(/^([A-Z]{3,})$/);
  if(m) return {type:'polygon',pts:m[1].split(''),refs:m[1].split('')};
  m=t.match(/^(segment|line|circle|polygon|angle|midpoint)\s*\(\s*([^()]+?)\s*\)$/i);
  if(!m) return null;
  const cmd=m[1].toLowerCase();
  const args=m[2].split(',').map(function(s){ return s.trim(); }).filter(Boolean);
  if(cmd==='midpoint'){
    if(args.length!==2) return null;
    return {type:'point',dep:{k:'mid',a:args[0],b:args[1]},refs:args};
  }
  if(cmd==='polygon'){
    if(args.length<3) return null;
    return {type:'polygon',pts:args,refs:args};
  }
  const need={segment:2,line:2,circle:2,angle:3}[cmd];
  if(!need||args.length!==need) return null;
  if(cmd==='segment') return {type:'segment',a:args[0],b:args[1],refs:args};
  if(cmd==='line') return {type:'line',a:args[0],b:args[1],refs:args};
  if(cmd==='circle') return {type:'circle',c:args[0],p:args[1],refs:args};
  if(cmd==='angle') return {type:'angle',a:args[0],v:args[1],b:args[2],refs:args};
  return null;
}

function geoHitObject(p,pts){
  pts=pts||geoSolve();
  let best=null,bd=18;
  S.geo.objs.forEach(function(o){
    if(o.type!=='segment'&&o.type!=='line') return;
    const a=pts[o.a],b=pts[o.b];
    if(!a||!b) return;
    let d;
    if(o.type==='segment'){
      d=geoDist2Seg(p,a,b);
    }else{
      const ax=toX(a.x),ay=toY(a.y),bx=toX(b.x),by=toY(b.y);
      const dx=bx-ax,dy=by-ay,L=Math.sqrt(dx*dx+dy*dy)||1;
      d=Math.abs((p.x-ax)*dy-(p.y-ay)*dx)/L;
    }
    if(d<bd){ bd=d;best={kind:'seg',o:o}; }
  });
  // 圆：命中圆周（到圆心距离与半径之差）
  S.geo.objs.forEach(function(o){
    if(o.type!=='circle') return;
    const c=pts[o.c],r0=pts[o.p];
    if(!c||!r0) return;
    const cx=toX(c.x),cy=toY(c.y),rx=toX(r0.x),ry=toY(r0.y);
    const r=Math.sqrt((rx-cx)*(rx-cx)+(ry-cy)*(ry-cy));
    if(r<1) return;
    const dd=Math.abs(Math.sqrt((p.x-cx)*(p.x-cx)+(p.y-cy)*(p.y-cy))-r);
    if(dd<bd){ bd=dd;best={kind:'circ',o:o}; }
  });
  S.exprs.forEach(function(ex){
    if(!ex.fn||!String(ex.text||'').trim()) return;
    const wx=worldX(p.x),d0=ex.dom||{};
    if(typeof d0.xLo==='number'&&wx<d0.xLo-1e-9) return;
    if(typeof d0.xHi==='number'&&wx>d0.xHi+1e-9) return;
    let y;
    try{ y=ex.fn({x:wx,y:0}); }catch(err){ return; }
    if(typeof y!=='number'||!isFinite(y)) return;
    const py=toY(y);
    if(py<-40||py>H+40) return;
    const d=Math.abs(py-p.y);
    if(d<bd){ bd=d;best={kind:'curve',ex:ex}; }
  });
  return best;
}
function geoPointColor(){
  const n=S.geo.objs.filter(function(o){ return o.type==='point'; }).length;
  return GDOT[n%GDOT.length];
}
function geoAddPointOn(hit,p){
  const pts=geoSolve();
  if(hit.kind==='curve'){
    const ex=hit.ex;
    let xv=worldX(p.x);
    const d=ex.dom||{};
    if(typeof d.xLo==='number') xv=Math.max(xv,d.xLo);
    if(typeof d.xHi==='number') xv=Math.min(xv,d.xHi);
    geoAddObj({oid:++idSeq,type:'point',name:geoNextName(),dep:null,
      on:{k:'curve',id:ex.id,ref:ex.body||ex.text,x:xv},
      label:true,color:geoPointColor(),err:null});
    return;
  }
  if(hit.kind==='circ'){
    const o=hit.o,c=pts[o.c],r0=pts[o.p];
    if(!c||!r0) return;
    const ang=Math.atan2(worldY(p.y)-c.y,worldX(p.x)-c.x);
    geoAddObj({oid:++idSeq,type:'point',name:geoNextName(),dep:null,
      on:{k:'circ',c:o.c,p:o.p,ang:ang},
      label:true,color:geoPointColor(),err:null});
    return;
  }
  const seg=hit.o,a=pts[seg.a],b=pts[seg.b];
  if(!a||!b) return;
  const ax=toX(a.x),ay=toY(a.y),bx=toX(b.x),by=toY(b.y);
  const dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy||1;
  let t=((p.x-ax)*dx+(p.y-ay)*dy)/L2;
  t=(seg.type==='line')?t:clamp(t,0,1);
  geoAddObj({oid:++idSeq,type:'point',name:geoNextName(),dep:null,
    on:{k:'seg',a:seg.a,b:seg.b,line:(seg.type==='line')},t:t,
    label:true,color:geoPointColor(),err:null});
}
function geoDragOnObj(o,px,py,pts){
  if(!o.on) return;
  if(o.on.k==='seg'){
    const a=pts[o.on.a],b=pts[o.on.b];
    if(!a||!b) return;
    const ax=toX(a.x),ay=toY(a.y),bx=toX(b.x),by=toY(b.y);
    const dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy||1;
    const t=((px-ax)*dx+(py-ay)*dy)/L2;
    o.t=(o.on.line)?t:clamp(t,0,1);
  }else if(o.on.k==='circ'){
    const c=pts[o.on.c],r0=pts[o.on.p];
    if(!c||!r0) return;
    o.on.ang=Math.atan2(worldY(py)-c.y,worldX(px)-c.x);
  }else if(o.on.k==='curve'){
    const ex=geoExById(o.on.id);
    if(!ex||!ex.fn) return;
    let xv=worldX(px);
    const d=ex.dom||{};
    if(typeof d.xLo==='number') xv=Math.max(xv,d.xLo);
    if(typeof d.xHi==='number') xv=Math.min(xv,d.xHi);
    o.on.x=xv;
  }
}
function geoIsLine(a,b){
  let r=false;
  S.geo.objs.forEach(function(o){
    if(o.type==='line'&&o.a===a&&o.b===b) r=true;
  });
  return r;
}
function geoTap(p){
  const g=S.geo;
  if(g.tool==='select'){
    g.pend=[];
    requestDraw();
    return;
  }
  if(g.tool==='onobj'){
    const hit=geoHitObject(p);
    if(!hit){ toast('点一下函数曲线或线段'); return; }
    geoAddPointOn(hit,p);
    g.pend=[];
    syncGeoRows();
    return;
  }
  if(g.tool==='perp'||g.tool==='parallel'){
    const kind=(g.tool==='perp')?'垂线':'平行线';
    if(!g.pbase){
      const hit=geoHitObject(p);
      if(!hit||hit.kind!=='seg'){ toast('先点一条已有的线段或直线作为基准'); return; }
      g.pbase={a:hit.o.a,b:hit.o.b,type:hit.o.type};
      const lname=(hit.o.type==='line')?'直线':'线段';
      const cap=$('#caption');
      if(cap&&S.tab==='geo') cap.textContent=kind+'：基准 '+lname+hit.o.a+hit.o.b+'，再点一个点';
      toast('基准选中：'+lname+' '+hit.o.a+hit.o.b+'，再点一个点');
      requestDraw();
      return;
    }
    let pn=geoHitPoint(p);
    if(!pn) pn=geoAddPoint(worldX(p.x),worldY(p.y));
    const pts0=geoSolve();
    const A0=pts0[g.pbase.a],B0=pts0[g.pbase.b];
    const bl=(A0&&B0)?Math.sqrt((B0.x-A0.x)*(B0.x-A0.x)+(B0.y-A0.y)*(B0.y-A0.y)):0;
    const nid=++idSeq;
    const baseName=g.pbase.a+g.pbase.b;
    geoAddObj({oid:nid,type:'line',a:pn,b:'q'+nid,
      dep:{k:(g.tool==='perp'?'perp':'para'),pt:pn,a:g.pbase.a,b:g.pbase.b,len:(bl>1e-9?bl:3)},
      color:geoPickColor('line'),label:true,err:null});
    g.pbase=null;
    g.pend=[];
    syncGeoRows();
    toast('已作'+kind+'：过 '+pn+' '+(g.tool==='perp'?'垂直于':'平行于')+' '+baseName+'，拖动该点可平移这条线');
    const cap2=$('#caption');
    if(cap2&&S.tab==='geo') cap2.textContent=(g.tool==='perp'?'垂线：先点一条线段或直线，再点一个点，过该点作垂线':'平行线：先点一条线段或直线，再点一个点，过该点作平行线');
    return;
  }
  let name=geoHitPoint(p);
  if(!name) name=geoAddPoint(worldX(p.x),worldY(p.y));
  const tool=g.tool;
  if(tool==='point'){ g.pend=[]; syncGeoRows(); return; }
  if(tool==='polygon'){
    const shape=g.shape||'poly';
    if(shape==='poly'){
      if(g.pend.length>=3&&name===g.pend[0]){
        geoAddObj({oid:++idSeq,type:'polygon',pts:g.pend.slice(),color:geoPickColor('polygon'),label:true,err:null});
        g.pend=[];
      }else if(g.pend.indexOf(name)<0){
        g.pend.push(name);
      }
      syncGeoRows();
      return;
    }
    if(g.pend.indexOf(name)<0) g.pend.push(name);
    const need=((shape==='square'||shape==='rect')?2:3);
    if(g.pend.length>=need){
      buildShape(shape,g.pend.slice());
      g.pend=[];
      const cap=$('#caption');
      if(cap&&S.tab==='geo') cap.textContent=shapeHint(shape);
    }
    syncGeoRows();
    return;
  }
  g.pend.push(name);
  const need=(tool==='angle')?3:2;
  if(g.pend.length>=need){
    const q=g.pend.slice();
    if(tool==='segment'){
      geoAddObj({oid:++idSeq,type:'segment',a:q[0],b:q[1],color:geoPickColor('segment'),label:true,err:null});
    }else if(tool==='circle'){
      geoAddObj({oid:++idSeq,type:'circle',c:q[0],p:q[1],color:geoPickColor('circle'),label:true,err:null});
    }else if(tool==='angle'){
      geoAddObj({oid:++idSeq,type:'angle',a:q[0],v:q[1],b:q[2],color:geoPickColor('angle'),label:true,err:null});
    }else if(tool==='midpoint'){
      geoAddObj({oid:++idSeq,type:'point',name:geoNextName(),dep:{k:'mid',a:q[0],b:q[1]},label:true,color:'#9254de',err:null});
    }
    g.pend=[];
  }
  syncGeoRows();
}

function shapeHint(k){
  return ({
    square:'正方形：点两个相邻顶点',
    rect:'长方形：点两个对角顶点',
    para:'平行四边形：点三个相邻顶点',
    tri:'三角形：点三个顶点',
    poly:'多边形：连续点若干点，再点回第一个点闭合'
  })[k]||'';
}
function buildShape(shape,names){
  const pts=geoSolve();
  const P=names.map(function(n){ return pts[n]; });
  if(P.some(function(q){ return !q; })) return;
  const poly=function(list){
    geoAddObj({oid:++idSeq,type:'polygon',pts:list,color:geoPickColor('polygon'),label:true,err:null});
    return list.join('');
  };
  if(shape==='tri'){
    toast('已生成三角形 '+poly(names.slice()));
    return;
  }
  if(shape==='square'){
    const A=P[0],B=P[1];
    const dx=B.x-A.x,dy=B.y-A.y;
    if(Math.sqrt(dx*dx+dy*dy)<1e-9){ toast('两个点重合了，换个点'); return; }
    const c=geoAddPoint(B.x-dy,B.y+dx);
    const d=geoAddPoint(A.x-dy,A.y+dx);
    toast('已生成正方形 '+poly([names[0],names[1],c,d]));
    return;
  }
  if(shape==='rect'){
    const A=P[0],B=P[1];
    if(Math.abs(A.x-B.x)<1e-9||Math.abs(A.y-B.y)<1e-9){ toast('这两个点在一条横线或竖线上，画不出长方形'); return; }
    const c=geoAddPoint(B.x,A.y);
    const d=geoAddPoint(A.x,B.y);
    toast('已生成长方形 '+poly([names[0],c,names[1],d]));
    return;
  }
  if(shape==='para'){
    const A=P[0],B=P[1],C=P[2];
    const d=geoAddPoint(A.x+C.x-B.x,A.y+C.y-B.y);
    toast('已生成平行四边形 '+poly([names[0],names[1],names[2],d]));
    return;
  }
}

function geoObjLabel(o,pts){
  switch(o.type){
    case 'point':
      if(o.on){
        if(o.on.k==='seg') return o.name+' = on(segment('+o.on.a+','+o.on.b+'))';
        if(o.on.k==='circ') return o.name+' = on(circle('+o.on.c+','+o.on.p+'))';
        return o.name+' = on('+(o.on.ref||'')+')';
      }
      if(o.dep&&o.dep.k==='mid') return 'midpoint('+o.dep.a+','+o.dep.b+')';
      return o.name+' = ('+dnum(o.x)+', '+dnum(o.y)+')';
    case 'segment': return '线段 '+o.a+o.b;
    case 'line':
      if(o.dep) return (o.dep.k==='perp'?'垂线 ':'平行线 ')+o.dep.pt+(o.dep.k==='perp'?' ⊥ ':' ∥ ')+o.dep.a+o.dep.b;
      return '直线 '+o.a+o.b;
    case 'circle': return '圆 '+o.c+o.p;
    case 'polygon': return '多边形 '+o.pts.join('');
    case 'angle': return '角 '+o.a+o.v+o.b;
  }
  return '';
}
function geoShapeName(o){
  if(o.type==='segment'||o.type==='line') return o.a+o.b;
  if(o.type==='circle') return o.c+o.p;
  if(o.type==='polygon') return o.pts.join('');
  if(o.type==='angle') return o.a+o.v+o.b;
  return '';
}
function geoSameDef(o,def){
  if(!def||o.type!==def.type) return false;
  if(def.type==='segment'||def.type==='line'){
    return (o.a===def.a&&o.b===def.b)||(o.a===def.b&&o.b===def.a);
  }
  if(def.type==='circle') return o.c===def.c&&o.p===def.p;
  if(def.type==='polygon'){
    const A=o.pts.join(''),B=def.pts.join('');
    return A===B||A===def.pts.slice().reverse().join('');
  }
  if(def.type==='angle') return o.a===def.a&&o.v===def.v&&o.b===def.b;
  return false;
}
function geoObjValue(o,pts){
  const A=pts[o.a],B=pts[o.b];
  switch(o.type){
    case 'point':
      if(o.on){
        const p=pts[o.name];
        return p?'= ('+dnum(p.x)+', '+dnum(p.y)+')':'';
      }
      if(o.dep&&o.dep.k==='mid'){
        const m=pts[o.name];
        return m?'= ('+dnum(m.x)+', '+dnum(m.y)+')':'';
      }
      return '';
    case 'segment':
      if(!A||!B) return '';
      return '= '+len2(Math.sqrt((B.x-A.x)*(B.x-A.x)+(B.y-A.y)*(B.y-A.y)));
    case 'circle':{
      const c=pts[o.c],p=pts[o.p];
      if(!c||!p) return '';
      return '= '+len2(Math.sqrt((p.x-c.x)*(p.x-c.x)+(p.y-c.y)*(p.y-c.y)));
    }
    case 'polygon':
      return '';
    case 'angle':{
      const d=angleDeg(o,pts);
      if(!isFinite(d)) return '';
      return '= '+fmtNum(d,1)+'°';
    }
  }
  return '';
}

/* ---------- 多边形：周长、面积、正多边形判定 ---------- */
const CN_DIGIT=['零','一','二','三','四','五','六','七','八','九'];
function cnCount(n){
  if(n<10) return CN_DIGIT[n];
  if(n<20) return '十'+(n%10?CN_DIGIT[n%10]:'');
  return String(n);
}
function polyName(n,regular){
  if(regular){
    if(n===3) return '正三角形';
    if(n===4) return '正方形';
    return '正'+cnCount(n)+'边形';
  }
  if(n===3) return '三角形';
  if(n===4) return '四边形';
  return cnCount(n)+'边形';
}
function polyMetrics(o,pts){
  const P=o.pts.map(function(n){ return pts[n]; });
  if(P.length<3||P.some(function(q){ return !q; })) return null;
  const n=P.length;
  const sides=[];
  let per=0;
  for(let i=0;i<n;i++){
    const q=P[(i+1)%n];
    const l=Math.sqrt((q.x-P[i].x)*(q.x-P[i].x)+(q.y-P[i].y)*(q.y-P[i].y));
    sides.push(l);
    per+=l;
  }
  let ar=0;
  for(let i=0;i<n;i++){
    const q=P[(i+1)%n];
    ar+=P[i].x*q.y-q.x*P[i].y;
  }
  const avg=per/n;
  const tol=Math.max(1e-9,Math.abs(avg)*5e-4);
  const regular=sides.every(function(l){ return Math.abs(l-avg)<=tol; });
  return {n:n,per:per,area:Math.abs(ar)/2,regular:regular,sides:sides};
}
function polyInfoText(o,pts){
  const m=polyMetrics(o,pts);
  if(!m) return '';
  return polyName(m.n,m.regular)+' · 周长 '+len2(m.per)+' · 面积 '+len2(m.area);
}

function drawGeo(){
  const g=S.geo,pts=geoSolve();
  ctx.save();
  // 函数曲线：几何模式下也能把函数画在同一张图上
  S.exprs.forEach(function(ex){
    if(ex.fn&&String(ex.text||'').trim()) drawCurve(ex);
  });
  // 多边形
  g.objs.forEach(function(o){
    if(o.type!=='polygon') return;
    const P=o.pts.map(function(n){return pts[n];});
    if(P.some(function(q){return !q;})) return;
    ctx.beginPath();
    ctx.moveTo(toX(P[0].x),toY(P[0].y));
    for(let i=1;i<P.length;i++) ctx.lineTo(toX(P[i].x),toY(P[i].y));
    ctx.closePath();
    ctx.fillStyle=rgbaOf(o.color,0.10);
    ctx.fill();
    ctx.strokeStyle=o.color;ctx.lineWidth=2;
    ctx.stroke();
  });
  // 圆
  g.objs.forEach(function(o){
    if(o.type!=='circle') return;
    const c=pts[o.c],p=pts[o.p];
    if(!c||!p) return;
    const r=Math.sqrt((p.x-c.x)*(p.x-c.x)+(p.y-c.y)*(p.y-c.y));
    if(!r) return;
    ctx.beginPath();
    ctx.arc(toX(c.x),toY(c.y),r*S.view.unit,0,Math.PI*2);
    ctx.strokeStyle=o.color;ctx.lineWidth=2;ctx.stroke();
  });
  // 圆的半径 / 直径（勾选后作为线段显示在图中）
  g.objs.forEach(function(o){
    if(o.type!=='circle') return;
    if(!o.showR&&!o.showD) return;
    const c=pts[o.c],p=pts[o.p];
    if(!c||!p) return;
    const cx=toX(c.x),cy=toY(c.y),px=toX(p.x),py=toY(p.y);
    ctx.save();
    ctx.strokeStyle=o.color;ctx.lineWidth=1.8;
    if(o.showR){
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(px,py);
      ctx.setLineDash([7,4]);ctx.stroke();
    }
    if(o.showD){
      ctx.beginPath();ctx.setLineDash([2,3]);
      ctx.moveTo(px,py);ctx.lineTo(cx*2-px,cy*2-py);
      ctx.stroke();
    }
    ctx.restore();
  });
  // 线段 / 直线
  g.objs.forEach(function(o){
    if(o.type!=='segment'&&o.type!=='line') return;
    const a=pts[o.a],b=pts[o.b];
    if(!a||!b) return;
    let ax=toX(a.x),ay=toY(a.y),bx=toX(b.x),by=toY(b.y);
    if(o.type==='line'){
      const dx=bx-ax,dy=by-ay,L=Math.sqrt(dx*dx+dy*dy)||1;
      const k=(W+H)*1.4/L;
      ax-=dx*k;ay-=dy*k;bx+=dx*k;by+=dy*k;
    }
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);
    ctx.strokeStyle=o.color;ctx.lineWidth=2;ctx.stroke();
  });
  // 角
  g.objs.forEach(function(o){
    if(o.type!=='angle') return;
    const a=pts[o.a],v=pts[o.v],b=pts[o.b];
    if(!a||!v||!b) return;
    const vx=toX(v.x),vy=toY(v.y);
    const a1=Math.atan2(toY(a.y)-vy,toX(a.x)-vx);
    const a2=Math.atan2(toY(b.y)-vy,toX(b.x)-vx);
    let d=a2-a1;
    while(d<=-Math.PI) d+=Math.PI*2;
    while(d>Math.PI) d-=Math.PI*2;
    const rr=26;
    ctx.beginPath();
    if(d>=0) ctx.arc(vx,vy,rr,a1,a1+d);
    else ctx.arc(vx,vy,rr,a2,a2-d);
    ctx.strokeStyle=o.color;ctx.lineWidth=1.8;ctx.stroke();
    const mA=a1+d*0.5,label=geoObjValue(o,pts).replace('= ','');
    ctx.font='600 11.5px -apple-system,"Segoe UI","PingFang SC",sans-serif';
    ctx.fillStyle=o.color;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(label,vx+Math.cos(mA)*(rr+16),vy+Math.sin(mA)*(rr+16));
  });
  // 点
  g.objs.forEach(function(o){
    if(o.type!=='point') return;
    const q=pts[o.name];
    if(!q) return;
    const px=toX(q.x),py=toY(q.y);
    ctx.beginPath();ctx.arc(px,py,13,0,Math.PI*2);
    ctx.fillStyle=rgbaOf(o.color,0.17);ctx.fill();
    ctx.beginPath();ctx.arc(px,py,5.4,0,Math.PI*2);
    ctx.fillStyle=o.color;ctx.fill();
    ctx.lineWidth=1.7;ctx.strokeStyle='#fff';ctx.stroke();
    if(o.label){
      ctx.font='600 13px -apple-system,"Segoe UI","PingFang SC",sans-serif';
      ctx.fillStyle=o.color;ctx.textAlign='left';ctx.textBaseline='alphabetic';
      ctx.fillText(o.name,px+8,py-9);
    }
  });
  // 待选点提示
  g.pend.forEach(function(n){
    const q=pts[n];
    if(!q) return;
    ctx.beginPath();ctx.arc(toX(q.x),toY(q.y),9.5,0,Math.PI*2);
    ctx.strokeStyle='#2f6bdb';ctx.lineWidth=2;ctx.stroke();
  });
  if(!g.objs.length&&!hasGeoCurves()){
    drawHintText(S.geo.tool==='point'?'点击画布添加点':'选一个工具，在画布上点击作图','下方表达式既可以是函数（sin(x)），也可以是几何对象');
  }
  ctx.restore();
}

/* ================= 历史记录 ================= */
let history=[],hi=0,histTimer=0,idSeq=1;
function snapshot(){
  return JSON.stringify({
    e:S.exprs.map(function(e){ return {text:e.text,color:e.color}; }),
    g:S.geo.objs.map(function(o){
      const c={};
      Object.keys(o).forEach(function(k){ if(k!=='err') c[k]=o[k]; });
      return c;
    })
  });
}
function updateHistBtns(){
  $('#btn-undo').disabled=hi<=0;
  $('#btn-redo').disabled=hi>=history.length-1;
}
function commit(){
  const s=snapshot();
  if(!history.length){ history=[s];hi=0;updateHistBtns();return; }
  if(history[hi]===s){ updateHistBtns();return; }
  history=history.slice(0,hi+1);
  history.push(s);
  hi=history.length-1;
  if(history.length>70){ history.shift();hi--; }
  updateHistBtns();
}
function scheduleCommit(){
  clearTimeout(histTimer);
  histTimer=setTimeout(commit,450);
}
function applySnapshot(str){
  let o;
  try{ o=JSON.parse(str); }catch(err){ return; }
  if(Array.isArray(o)) o={e:o,g:[]};
  S.exprs=(o.e||[]).map(function(x){
    return {id:++idSeq,text:x.text,color:x.color,fn:null,err:null};
  });
  if(!S.exprs.length) S.exprs=[{id:++idSeq,text:'',color:COLORS[0],fn:null,err:null}];
  S.geo.objs=(o.g||[]).map(function(x){
    x.oid=++idSeq;
    x.err=null;
    if(x.type==='point'&&!x.name) x.name=geoNextName();
    return x;
  });
  S.geo.pend=[];
  S.exprs.forEach(recompile);
  // 撤销后函数 id 会重排，把“函数上的点”重新挂回对应表达式
  S.geo.objs.forEach(function(o){
    if(o.type!=='point'||!o.on||o.on.k!=='curve') return;
    const ref=String(o.on.ref||'').trim();
    let ex=null;
    S.exprs.forEach(function(e){ if(!ex&&String(e.body||'').trim()===ref) ex=e; });
    if(!ex) S.exprs.forEach(function(e){ if(!ex&&String(e.text||'').trim()===ref) ex=e; });
    if(ex){ o.on.id=ex.id; o.on.ref=ex.body||ex.text; }
  });
  S.activeId=S.exprs[0]?S.exprs[0].id:null;
  renderRows();refreshErrBar();requestDraw();
}
function undo(){
  clearTimeout(histTimer);
  if(hi>0){ hi--;applySnapshot(history[hi]);updateHistBtns(); }
}
function redo(){
  clearTimeout(histTimer);
  if(hi<history.length-1){ hi++;applySnapshot(history[hi]);updateHistBtns(); }
}

function badgeFor(type){
  if(type==='surface') return ICON_SURF;
  if(type==='curve') return ICON_CURVE;
  if(type==='segment'||type==='line') return ICON_SEG;
  if(type==='circle') return ICON_CIRC;
  if(type==='polygon') return ICON_POLY;
  if(type==='angle') return ICON_ANG;
  if(type==='mid') return ICON_MID;
  return '';

function recompile(ex){
  const mode=(S.tab==='three')?'three':'func';
  if(!String(ex.text||'').trim()){ ex.fn=null;ex.err=null;ex.dom=null;ex.body='';return; }
  const r=compileText(ex.text,mode);

function numShort(v){
  if(typeof v!=='number'||!isFinite(v)) return '∞';
  return String(Math.round(v*1000)/1000);
}
function bracketOf(lo,hi,loOpen,hiOpen){
  const a=(typeof lo==='number')?numShort(lo):'-∞';
  const b=(typeof hi==='number')?numShort(hi):'∞';
  return (loOpen?'(':'[')+a+','+b+(hiOpen?')':']');
}
function rangeLabel(ex){
  const d=ex.dom||{};
  const hx=(typeof d.xLo==='number'||typeof d.xHi==='number');
  const hy=(typeof d.yLo==='number'||typeof d.yHi==='number');
  if(!hx&&!hy) return '范围';
  const p=[];
  if(hx) p.push('x'+bracketOf(d.xLo,d.xHi,d.xLoOpen,d.xHiOpen));
  if(hy) p.push('y'+bracketOf(d.yLo,d.yHi,d.yLoOpen,d.yHiOpen));
  return p.join(' ');
}
function openDomSheet(ex,input,btn){
  const d=ex.dom||{};
  const is3=(S.tab==='three');
  function grpHTML(k,lo,hi,loO,hiO){
    return '<div class="dom-grp" data-g="'+k+'">'+
      '<div class="dom-line"><span class="dom-var">'+k+'</span>'+
      '<input class="dom-in" type="text" inputmode="decimal" data-k="lo" placeholder="起点，留空=不限" value="'+(typeof lo==='number'?numShort(lo):'')+'">'+
      '<span class="dom-arrow">→</span>'+
      '<input class="dom-in" type="text" inputmode="decimal" data-k="hi" placeholder="终点，留空=不限" value="'+(typeof hi==='number'?numShort(hi):'')+'">'+
      '</div>'+
      '<div class="dom-flags"><label><input type="checkbox" data-k="loOpen"'+(loO?' checked':'')+'>起点不含</label>'+
      '<label><input type="checkbox" data-k="hiOpen"'+(hiO?' checked':'')+'>终点不含</label></div>'+
      '</div>';
  }
  openSheet('自变量取值范围',
    grpHTML('x',d.xLo,d.xHi,d.xLoOpen,d.xHiOpen)+
    (is3?grpHTML('y',d.yLo,d.yHi,d.yLoOpen,d.yHiOpen):'')+
    '<p class="dom-tip">'+(is3?'曲面的定义域是 x、y 的一块矩形区域。':'只画这段范围内的曲线，端点实心表示包含、空心表示不包含。')+
    '也可以直接在表达式里写 <b>sin(x), -2&lt;=x&lt;=3</b>'+(is3?' 或 <b>-2&lt;=x&lt;=2, -1&lt;=y&lt;=1</b>':'')+'</p>'+
    '<div class="sheet-btns"><button data-act="apply" class="wide">应用</button>'+
    '<button data-act="clear">清除范围</button><button data-act="cancel">取消</button></div>',
    function(sheet){
      function readSegs(){
        const segs=[];
        let bad='';
        Array.from(sheet.querySelectorAll('.dom-grp')).forEach(function(g){
          if(bad) return;
          const k=g.dataset.g;
          const loTxt=g.querySelector('input[data-k="lo"]').value.trim();
          const hiTxt=g.querySelector('input[data-k="hi"]').value.trim();
          const loO=g.querySelector('input[data-k="loOpen"]').checked;
          const hiO=g.querySelector('input[data-k="hiOpen"]').checked;
          if(!loTxt&&!hiTxt) return;
          let lo=null,hi=null;
          if(loTxt){ lo=evalConst(loTxt); if(lo===null){ bad=loTxt; return; } }
          if(hiTxt){ hi=evalConst(hiTxt); if(hi===null){ bad=hiTxt; return; } }
          let lt=loTxt, ht=hiTxt;
          if(lo!==null&&hi!==null&&lo>hi){
            const t=lo;lo=hi;hi=t; lt=numShort(lo); ht=numShort(hi);
          }
          const op1=loO?'<':'<=', op2=hiO?'<':'<=';
          if(lt&&ht) segs.push(lt+op1+k+op2+ht);
          else if(lt) segs.push(k+(loO?'>':'>=')+lt);
          else segs.push(k+(hiO?'<':'<=')+ht);
        });
        return {segs:segs,bad:bad};
      }
      function apply(segs){
        const body=String(ex.body||'').trim();
        if(!body){ toast('先输入一个表达式'); return; }
        ex.text=body+(segs.length?(', '+segs.join(', ')):'');
        if(input) input.value=ex.text;
        recompile(ex);
        if(btn){
          btn.textContent=rangeLabel(ex);
          btn.classList.toggle('on',!!ex.dom);
          btn.hidden=!ex.text.trim();
        }
        if(input&&input.closest('.row')) input.closest('.row').classList.toggle('is-error',!!ex.err);
        refreshErrBar();
        requestDraw();
        updateReadout();
        commit();
        closeSheet();
        toast(ex.dom?'已设置范围 '+rangeLabel(ex):'已清除范围');
      }
      sheet.querySelector('[data-act="apply"]').addEventListener('click',function(){
        const r=readSegs();
        if(r.bad){ toast('“'+r.bad+'” 不是有效数值'); return; }
        apply(r.segs);
      });
      sheet.querySelector('[data-act="clear"]').addEventListener('click',function(){ apply([]); });
      sheet.querySelector('[data-act="cancel"]').addEventListener('click',closeSheet);
    });
}
