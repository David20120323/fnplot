/* ---------- 几何式行 ---------- */
function geoPickColor(type){
  if(type==='point'){
    const n=S.geo.objs.filter(function(o){ return o.type==='point'; }).length;
    return GDOT[n%GDOT.length];
  }
  const n=S.geo.objs.filter(function(o){ return o.type!=='point'; }).length;
  return GSHAPE[n%GSHAPE.length];
}
function resolveCurveRef(ref){
  const t=String(ref||'').trim();
  if(!t) return null;
  let ex=null;
  S.exprs.forEach(function(e){ if(!ex&&String(e.body||'').trim()===t) ex=e; });
  if(!ex) S.exprs.forEach(function(e){ if(!ex&&String(e.text||'').trim()===t) ex=e; });
  if(!ex){
    ex={id:++idSeq,text:t,color:COLORS[S.exprs.length%COLORS.length],fn:null,err:null};
    S.exprs.push(ex);
    recompile(ex);
    if(!ex.fn){ S.exprs.pop(); return null; }
  }
  return ex;
}
function geoFromDef(def){
  const o={oid:++idSeq,color:geoPickColor(def.type),label:true,err:null};
  if(def.type==='point'){
    o.type='point';
    o.name=def.name||geoNextName();
    o.x=(def.x===undefined?0:def.x);
    o.y=(def.y===undefined?0:def.y);
    o.dep=def.dep?{k:'mid',a:def.dep.a,b:def.dep.b}:null;
    if(def.dep) o.color='#9254de';
    if(def.on){
      o.dep=null;
      if(def.on.k==='seg'){
        o.on={k:'seg',a:def.on.a,b:def.on.b,line:geoIsLine(def.on.a,def.on.b)};
        o.t=(def.t==null?0.5:def.t);
      }else if(def.on.k==='circ'){
        o.on={k:'circ',c:def.on.c,p:def.on.p,ang:(def.ang==null?0:def.ang)};
      }else{
        const ex=resolveCurveRef(def.on.ref);
        if(!ex||!ex.fn) return null;
        let xv=S.view.cx;
        if(ex.dom&&typeof ex.dom.xLo==='number') xv=Math.max(xv,ex.dom.xLo);
        if(ex.dom&&typeof ex.dom.xHi==='number') xv=Math.min(xv,ex.dom.xHi);
        o.on={k:'curve',id:ex.id,ref:ex.body||ex.text,x:xv};
      }
    }
  }else{
    o.type=def.type;
    if(def.type==='polygon') o.pts=def.pts.slice();
    else{ o.a=def.a;o.b=def.b;o.c=def.c;o.p=def.p;o.v=def.v; }
  }
  return o;
}
function geoAddObj(o){
  S.geo.objs.push(o);
  S.activeId=o.oid;
  return o;
}
function geoAddPoint(x,y,color){
  const o={oid:++idSeq,type:'point',name:geoNextName(),x:x,y:y,dep:null,label:true,err:null,
    color:color||geoPickColor('point')};
  geoAddObj(o);
  return o.name;
}

function angleDeg(o,pts){
  pts=pts||geoSolve();
  const a=pts[o.a],v=pts[o.v],b=pts[o.b];
  if(!a||!v||!b) return NaN;
  const u1=[a.x-v.x,a.y-v.y],u2=[b.x-v.x,b.y-v.y];
  const l1=Math.sqrt(u1[0]*u1[0]+u1[1]*u1[1]),l2=Math.sqrt(u2[0]*u2[0]+u2[1]*u2[1]);
  if(!l1||!l2) return NaN;
  const cosv=clamp((u1[0]*u2[0]+u1[1]*u2[1])/(l1*l2),-1,1);
  return Math.acos(cosv)*180/Math.PI;
}
function setCircleR(o,val,isDia){
  const r=isDia?val/2:val;
  if(!isFinite(val)||!(r>1e-6)){ toast('半径要是一个大于 0 的数'); return false; }
  const pts=geoSolve();
  const c=pts[o.c],p=pts[o.p];
  if(!c||!p){ toast('圆心或圆上的点还没算出来'); return false; }
  let dx=p.x-c.x,dy=p.y-c.y;
  const L=Math.sqrt(dx*dx+dy*dy);
  if(L<1e-9){ dx=1;dy=0; }
  const ux=dx/(L<1e-9?1:L),uy=dy/(L<1e-9?1:L);
  let pp=null;
  for(let i=0;i<S.geo.objs.length;i++){
    const x=S.geo.objs[i];
    if(x.type==='point'&&x.name===o.p){ pp=x;break; }
  }
  if(!pp||pp.on||pp.dep){ toast('圆上的这个点被其它对象约束，改不了圆的半径'); return false; }
  pp.x=c.x+ux*r;
  pp.y=c.y+uy*r;
  syncGeoRows();
  toast('已把圆的'+(isDia?'直径':'半径')+'改为 '+len2(isDia?r*2:r));
  return true;
}
function setAngleDeg(o,T){
  const pts=geoSolve();
  const A=pts[o.a],V=pts[o.v],B=pts[o.b];
  if(!A||!V||!B){ toast('角的三个点还没算出来'); return false; }
  if(!(T>0.01)||!(T<179.99)){ toast('角度要大于 0 且小于 180 度'); return false; }
  const th=angleDeg(o,pts);
  if(!isFinite(th)){ toast('这个角还算不出来'); return false; }
  const findPt=function(n){
    for(let i=0;i<S.geo.objs.length;i++){
      const x=S.geo.objs[i];
      if(x.type==='point'&&x.name===n) return x;
    }
    return null;
  };
  const free=function(x){ return x&&!x.on&&!x.dep; };
  const bpt=findPt(o.b),apt=findPt(o.a);
  if(!free(bpt)&&!free(apt)){ toast('这个角的两条边都被其它对象约束，改不了角度'); return false; }
  const w=[B.x-V.x,B.y-V.y];
  const u=[A.x-V.x,A.y-V.y];
  const cross=u[0]*w[1]-u[1]*w[0];
  const sgn=(cross>=0)?1:-1;
  const delta=(T-th)*Math.PI/180*sgn;
  const c=Math.cos(delta),s=Math.sin(delta);
  if(free(bpt)){
    bpt.x=V.x+w[0]*c-w[1]*s;
    bpt.y=V.y+w[0]*s+w[1]*c;
  }else{
    const c2=Math.cos(-delta),s2=Math.sin(-delta);
    apt.x=V.x+u[0]*c2-u[1]*s2;
    apt.y=V.y+u[0]*s2+u[1]*c2;
  }
  syncGeoRows();
  toast('角 '+o.a+o.v+o.b+' 已改为 '+fmtNum(T,1)+'°');
  return true;
}
function setSegLen(o,l){
  const pts=geoSolve();
  const A=pts[o.a],B=pts[o.b];
  if(!A||!B){ toast('线段端点还没算出来'); return false; }
  if(!(l>1e-9)){ toast('长度要大于 0'); return false; }
  const dx=B.x-A.x,dy=B.y-A.y;
  const L=Math.sqrt(dx*dx+dy*dy);
  if(L<1e-9){ toast('两个端点重合了，无法确定方向'); return false; }
  const ux=dx/L,uy=dy/L;
  const findPt=function(n){
    for(let i=0;i<S.geo.objs.length;i++){
      const x=S.geo.objs[i];
      if(x.type==='point'&&x.name===n) return x;
    }
    return null;
  };
  const bpt=findPt(o.b),apt=findPt(o.a);
  const free=function(x){ return x&&!x.on&&!x.dep; };
  if(free(bpt)){ bpt.x=A.x+ux*l; bpt.y=A.y+uy*l; }
  else if(free(apt)){ apt.x=B.x-ux*l; apt.y=B.y-uy*l; }
  else{ toast('这条线段的两端都被其它对象约束，改不了长度'); return false; }
  syncGeoRows();
  toast('线段 '+o.a+o.b+' 的长度改为 '+len2(l));
  return true;
}
function geoRowValText(o){
  if(o.type==='point'&&o.dep&&o.dep.k==='mid'){
    const pts=geoSolve(),m=pts[o.name];
    return m?'= ('+fmtNum(m.x,2)+', '+fmtNum(m.y,2)+')':'';
  }
  const pts=geoSolve();
  return geoObjValue(o,pts);
}

  field.appendChild(input);

  row.appendChild(field);

}

      ai.type='text';

        done=true;
        if(!setAngleDeg(o,n)){ done=false; ai.value=isFinite(deg)?fmtNum(deg,1):''; }
      };

      val.appendChild(de);

    }

    const clr=document.createElement('button');

    field.appendChild(input);
    field.appendChild(val);
    field.appendChild(clr);

    if(o.type==='point'){
      const sub=document.createElement('div');

      const lb=document.createElement('label');

      if(info){

        sub.className='sub';
        const tag=document.createElement('span');
        tag.className='gtag';
        tag.textContent=info;
        sub.appendChild(tag);
        row.appendChild(sub);
      }
    }else if(o.type==='circle'){
      const ptsC=geoSolve();
      const c0=ptsC[o.c],p0=ptsC[o.p];
      const rv=(c0&&p0)?Math.sqrt((p0.x-c0.x)*(p0.x-c0.x)+(p0.y-c0.y)*(p0.y-c0.y)):0;
      const sub=document.createElement('div');
      sub.className='sub circ-sub';
      const mkRow=function(text,key,val,isDia){

        const lb=document.createElement('label');

          o[key]=cb.checked;
          requestDraw();
          commit();
        });
        lb.appendChild(cb);
        lb.appendChild(document.createTextNode(text));
        cr.appendChild(lb);
        const eq=document.createElement('span');
        eq.className='ceq';
        eq.textContent='=';
        cr.appendChild(eq);
        const inp=document.createElement('input');
        inp.type='text';
        inp.className='cirin';
        inp.inputMode='decimal';
        inp.value=len2(val);
        inp.title=isDia?'改这个直径可以改变圆的大小':'改这个半径可以改变圆的大小';
        let done=false;

          if(done) return;
          const n=parseFloat(normGeoText(inp.value));
          if(!isFinite(n)){ toast('要输入一个数'); inp.value=len2(val); return; }
          done=true;
          if(!setCircleR(o,n,isDia)){ done=false; inp.value=len2(val); }
        };
        inp.addEventListener('keydown',function(ev){

      };
      sub.appendChild(mkRow('半径','showR',rv,false));
      sub.appendChild(mkRow('直径','showD',rv*2,true));
      row.appendChild(sub);
    }
    rowsEl.appendChild(row);
  });

  // 末尾空行：用于输入新对象或新函数
  const row=rowShell(fEx.length+g.objs.length+1);
  row.dataset.oid='0';
  rowBadge(row,'#c3c8d0','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>','输入新对象或函数');
  const field=document.createElement('div');
  field.className='field';
  const input=document.createElement('input');
  input.type='text';
  input.value='';
  input.spellcheck=false;
  input.autocomplete='off';
  input.setAttribute('autocapitalize','off');
  input.placeholder='输入函数 sin(x)，或对象 A=(1,2)';
  input.addEventListener('focus',function(){ S.activeId=null;markActive(); });
  input.addEventListener('keydown',function(ev){
    if(ev.key!=='Enter') return;
    ev.preventDefault();
    const txt=input.value.trim();
    if(!txt) return;
    const def=parseGeoDef(txt);
    if(def){
      const pts=geoSolve();
      const miss=(def.refs||[]).filter(function(n){ return !pts[n]; });
      if(miss.length){ toast('点 '+miss[0]+' 还没有定义'); return; }
      if(def.type==='point'&&def.name){
        const same=S.geo.objs.filter(function(o){ return o.type==='point'&&o.name===def.name; })[0];
        if(same){
          if(def.x!==undefined){
            same.x=def.x;same.y=def.y;same.on=null;same.dep=null;same.t=null;delete same.err;
            toast('已把点 '+same.name+' 移到 ('+dnum(same.x)+', '+dnum(same.y)+')');
          }else if(def.on){
            geoApplyText(same,txt);
          }else{
            toast('已经有点 '+def.name+' 了');
          }
          input.value='';
          renderGeoRows();requestDraw();commit();
          const a2=rowsEl.querySelector('.row[data-oid="0"] input');
          if(a2) a2.focus();
          return;
        }
      }
      const dup=S.geo.objs.filter(function(o){ return geoSameDef(o,def); })[0];
      if(dup){
        toast('已经有'+(dup.type==='segment'?'线段 ':dup.type==='line'?'直线 ':'这个图形 ')+geoShapeName(dup)+' 了');
        return;
      }
      const o=geoFromDef(def);
      if(!o){ toast('看不懂这个写法'); return; }
      geoAddObj(o);
    }else{
      const ex={id:++idSeq,text:txt,color:COLORS[S.exprs.length%COLORS.length],fn:null,err:null};
      recompile(ex);
      if(!ex.fn){ toast('看不懂这个写法'); return; }
      S.exprs.push(ex);
      S.activeId=ex.id;
    }
    input.value='';
    renderGeoRows();
    requestDraw();
    commit();
    const again=rowsEl.querySelector('.row[data-oid="0"] input');
    if(again) again.focus();
  });
  field.appendChild(input);
  row.appendChild(field);
  rowsEl.appendChild(row);
  app.classList.toggle('geo-empty',g.objs.length===0&&!hasGeoCurves());
  const cnt=$('#geo-count');
  if(cnt) cnt.textContent=String(g.objs.length+fEx.length);
}

function geoApplyText(o,text,input){
  const def=parseGeoDef(text);
  const isPointRow=(o.type==='point');
  const snap=function(){ if(input) input.value=geoObjLabel(o,geoSolve()); };
  if(isPointRow&&o.dep&&o.dep.k!=='mid'){
    toast('这个点是垂线/平行线自动算出来的，不能改坐标');
    snap();
    return;
  }
  if(!isPointRow&&o.dep){
    toast('垂线/平行线随基准线自动变化，改写法请删掉这一行再重画');
    snap();
    return;
  }
  if(!def){
    toast(isPointRow?'坐标写法要像 A=(1,2) 或 (1,2)':'写法无法识别');
    snap();
    return;
  }
  if(isPointRow&&def.type!=='point'){ toast('这一行是一个点，写法要像 A=(1,2)'); snap(); return; }
  if(!isPointRow&&def.type==='point'){ toast('这一行是图形，删掉后可在下方新加一个点'); snap(); return; }
  if((def.type==='segment'||def.type==='line')&&def.a===def.b){ toast('两个点重合了，换个点'); snap(); return; }
  if(def.name&&def.name!==o.name){
    const dup=S.geo.objs.some(function(x){ return x!==o&&x.type==='point'&&x.name===def.name; });
    if(dup){ toast('已经有点 '+def.name+' 了'); snap(); return; }
  }
  const pts=geoSolve();
  const miss=(def.refs||[]).filter(function(n){ return !pts[n]; });
  if(miss.length){ toast('点 '+miss[0]+' 还没有定义'); snap(); return; }
  delete o.err;
  if(def.type==='point'){
    const oldX=(o.on&&o.on.k==='curve'&&typeof o.on.x==='number')?o.on.x:null;
    o.type='point';
    o.dep=def.dep?{k:'mid',a:def.dep.a,b:def.dep.b}:null;
    o.on=null;
    if(def.on){
      o.dep=null;
      if(def.on.k==='seg'){
        o.on={k:'seg',a:def.on.a,b:def.on.b,line:geoIsLine(def.on.a,def.on.b)};
        if(o.t==null) o.t=0.5;
      }else if(def.on.k==='circ'){
        const oldAng=(o.on&&o.on.k==='circ'&&typeof o.on.ang==='number')?o.on.ang:0;
        o.on={k:'circ',c:def.on.c,p:def.on.p,ang:oldAng};
      }else{
        const ex=resolveCurveRef(def.on.ref);
        if(!ex||!ex.fn){ toast('函数无法识别'); snap(); return; }
        o.on={k:'curve',id:ex.id,ref:ex.body||ex.text,x:(oldX!==null?oldX:S.view.cx)};
      }
    }
    if(def.x!==undefined){
      // 直接写坐标：变成自由点，位置按输入值
      o.x=def.x;o.y=def.y;o.on=null;o.dep=null;o.t=null;
    }
    o.name=def.name||o.name;
    if(o.dep){ o.color='#9254de'; }
  }else{
    o.type=def.type;
    if(def.type==='polygon') o.pts=def.pts.slice();
    else{ o.a=def.a;o.b=def.b;o.c=def.c;o.p=def.p;o.v=def.v; }
  }
  refreshErrBar();
  renderGeoRows();
  requestDraw();
  commit();
}
function geoRefs(o){
  if(o.type==='point'){
    if(o.on&&o.on.k==='seg') return [o.on.a,o.on.b];
    if(o.on&&o.on.k==='circ') return [o.on.c,o.on.p];
    return o.dep?[o.dep.a,o.dep.b]:[];
  }
  if(o.type==='segment'||o.type==='line') return o.dep?[o.dep.pt,o.dep.a,o.dep.b]:[o.a,o.b];
  if(o.type==='circle') return [o.c,o.p];
  if(o.type==='polygon') return o.pts.slice();
  if(o.type==='angle') return [o.a,o.v,o.b];
  return [];
}
function geoRemoveExpr(id){
  const kill={};
  S.geo.objs.forEach(function(o){
    if(o.type==='point'&&o.on&&o.on.k==='curve'&&o.on.id===id) kill[o.oid]=1;
  });
  S.geo.objs=S.geo.objs.filter(function(o){ return !kill[o.oid]; });
  S.exprs=S.exprs.filter(function(e){ return e.id!==id; });
  if(!S.exprs.length) S.exprs.push({id:++idSeq,text:'',color:COLORS[0],fn:null,err:null,dom:null,body:''});
  if(S.activeId===id) S.activeId=null;
  renderRows();refreshErrBar();requestDraw();commit();
}
function geoRemoveObj(oid){
  const o=S.geo.objs.filter(function(x){ return x.oid===oid; })[0];
  if(!o) return;
  const kill={};
  kill[oid]=1;
  const gone={};
  if(o.type==='point') gone[o.name]=1;
  let changed=true;
  while(changed){
    changed=false;
    S.geo.objs.forEach(function(x){
      if(kill[x.oid]) return;
      const refs=geoRefs(x);
      for(let i=0;i<refs.length;i++){
        if(gone[refs[i]]){
          kill[x.oid]=1;
          if(x.type==='point') gone[x.name]=1;
          changed=true;
          break;
        }
      }
    });
    S.geo.objs.forEach(function(x){
      if(kill[x.oid]) return;
      if(x.type!=='point'||!x.on||x.on.k!=='seg') return;
      const dead=S.geo.objs.some(function(s){
        return kill[s.oid]&&(s.type==='segment'||s.type==='line')&&s.a===x.on.a&&s.b===x.on.b;
      });
      if(dead){ kill[x.oid]=1;gone[x.name]=1;changed=true; }
    });
    S.geo.objs.forEach(function(x){
      if(kill[x.oid]) return;
      if(x.type!=='point'||!x.on||x.on.k!=='circ') return;
      const dead=S.geo.objs.some(function(s){
        return kill[s.oid]&&s.type==='circle'&&s.c===x.on.c&&s.p===x.on.p;
      });
      if(dead){ kill[x.oid]=1;gone[x.name]=1;changed=true; }
    });
  }
  S.geo.objs=S.geo.objs.filter(function(x){ return !kill[x.oid]; });
  S.geo.pend=S.geo.pend.filter(function(n){ return !gone[n]; });
  if(kill[S.activeId]) S.activeId=null;
  refreshErrBar();
  renderGeoRows();
  requestDraw();
  commit();
}

function focusRow(id){
  let row=rowsEl.querySelector('.row[data-oid="'+id+'"]');
  if(!row) row=rowsEl.querySelector('.row[data-id="'+id+'"]');
  if(!row) return;
  const input=row.querySelector('input');
  if(input){ input.focus();input.setSelectionRange(input.value.length,input.value.length); }
}
function addRow(){
  if(S.tab==='geo'){
    const last=rowsEl.querySelector('.row[data-oid="0"] input');
    if(last){ last.focus(); return; }
  }
  const last=S.exprs[S.exprs.length-1];
  if(last&&!String(last.text||'').trim()){ S.activeId=last.id;markActive();focusRow(last.id);return; }
  const ex={id:++idSeq,text:'',color:COLORS[S.exprs.length%COLORS.length],fn:null,err:null};
  S.exprs.push(ex);
  S.activeId=ex.id;
  renderRows();refreshErrBar();requestDraw();focusRow(ex.id);commit();
}
function removeRow(id){
  if(S.exprs.length<=1) return;
  S.exprs=S.exprs.filter(function(e){ return e.id!==id; });
  if(!S.exprs.some(function(e){ return e.id===S.activeId; })) S.activeId=S.exprs[0].id;
  renderRows();refreshErrBar();requestDraw();updateReadout();commit();
}


/* ================= 键盘输入 ================= */
function activeInput(){
  const a=document.activeElement;
  if(a&&a.tagName==='INPUT'&&a.closest('.rows')) return a;
  const rows=Array.from(rowsEl.querySelectorAll('.row'));
  for(let i=0;i<rows.length;i++){
    if(S.tab==='geo'){
      const oid=rows[i].dataset.oid;
      if(oid!==undefined){
        if(Number(oid)===S.activeId) return rows[i].querySelector('input');
      }else if(Number(rows[i].dataset.id)===S.activeId){
        return rows[i].querySelector('input');
      }
    }else if(Number(rows[i].dataset.id)===S.activeId){
      return rows[i].querySelector('input');
    }
  }
  const zero=rowsEl.querySelector('.row[data-oid="0"] input');
  if(zero) return zero;
  return rowsEl.querySelector('input');
}
function insertText(txt){
  const inp=activeInput();
  if(!inp) return;
  if(document.activeElement!==inp) inp.focus();
  const st=(inp.selectionStart===null||inp.selectionStart===undefined)?inp.value.length:inp.selectionStart;
  const en=(inp.selectionEnd===null||inp.selectionEnd===undefined)?st:inp.selectionEnd;
  inp.value=inp.value.slice(0,st)+txt+inp.value.slice(en);
  const pos=st+txt.length;
  inp.setSelectionRange(pos,pos);
  inp.dispatchEvent(new Event('input'));
}
function deleteChar(){
  const inp=activeInput();
  if(!inp) return;
  const st=(inp.selectionStart===null||inp.selectionStart===undefined)?inp.value.length:inp.selectionStart;
  const en=(inp.selectionEnd===null||inp.selectionEnd===undefined)?st:inp.selectionEnd;
  if(st!==en){
    inp.value=inp.value.slice(0,st)+inp.value.slice(en);
    inp.setSelectionRange(st,st);
  }else if(st>0){
    inp.value=inp.value.slice(0,st-1)+inp.value.slice(st);
    inp.setSelectionRange(st-1,st-1);
  }else{
    return;
  }
  inp.dispatchEvent(new Event('input'));
}
function moveCaret(dir){
  const inp=activeInput();
  if(!inp) return;
  if(document.activeElement!==inp) inp.focus();
  const st=(inp.selectionStart===null||inp.selectionStart===undefined)?0:inp.selectionStart;
  const pos=Math.max(0,Math.min(inp.value.length,st+dir));
  inp.setSelectionRange(pos,pos);
}
function onReturn(){
  if(S.tab==='geo'){
    const inp=activeInput();
    if(inp) inp.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true}));
    return;
  }
  const inp=activeInput();
  if(inp&&String(inp.value).trim()) addRow();
  else if(inp) inp.blur();
}

/* ================= 按键音 ================= */
let audioCtx=null;
function beep(){
  if(!S.sound) return;
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const t=audioCtx.currentTime;
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.type='triangle';
    o.frequency.value=920;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.05,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.08);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start(t);
    o.stop(t+0.09);
  }catch(err){}
}
function toggleSound(){
  S.sound=!S.sound;
  $('#btn-sound').style.color=S.sound?'#2f6bdb':'';
  toast(S.sound?'按键音已开启':'按键音已关闭');
}

    ['act','num','123'],['act','ret','']
  ];
  extra.forEach(function(it){

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function shrink(s){ return s.length>16?s.slice(0,15)+'…':s; }
function updateReadout(){
  const box=$('#readout');
  if(!S.trace||S.tab!=='func'||!S.hover){
    box.hidden=true;
    box.innerHTML='';
    return;
  }
  const px=clamp(S.hover.px,0,W);
  const vars={x:worldX(px),y:0};
  let html='<div class="ro-x">x = '+fmtNum(vars.x,2)+'</div>';
  let n=0;
  S.exprs.forEach(function(ex){
    if(n>=4) return;
    if(!ex.fn||!String(ex.text||'').trim()) return;
    const d=ex.dom||{};
    if(typeof d.xLo==='number'&&vars.x<d.xLo-1e-9) return;
    if(typeof d.xHi==='number'&&vars.x>d.xHi+1e-9) return;
    let y;
    try{ y=ex.fn(vars); }catch(err){ return; }
    if(!isFinite(y)) return;
    html+='<div class="ro-line"><i style="background:'+ex.color+'"></i><span>'+
      escapeHtml(shrink(String((ex.body||ex.text)).replace(/^y\s*=\s*/i,''))) + ' = ' + fmtNum(y,3)+'</span></div>';
    n++;
  });
  box.innerHTML=html;
  box.hidden=false;
}

/* ================= 交互 ================= */
const ptrs=new Map();
let act=null;
function loc(e){
  const r=cv.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}
function dist(a,b){ return Math.sqrt((a.x-b.x)*(a.x-b.x)+(a.y-b.y)*(a.y-b.y)); }
cv.addEventListener('pointerdown',function(e){
  if(e.pointerType==='mouse'&&e.button!==0) return;
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  const p=loc(e);
  ptrs.set(e.pointerId,p);
  if(ptrs.size===2){
    const arr=Array.from(ptrs.values());
    act={type:'pinch',d0:Math.max(1,dist(arr[0],arr[1])),u0:S.view.unit,cx0:S.view.cx,cy0:S.view.cy,
      mid0:{x:(arr[0].x+arr[1].x)/2,y:(arr[0].y+arr[1].y)/2}};
    return;
  }
  if(ptrs.size>2) return;
  S.hover=null;
  updateReadout();
  if(S.tab==='geo'){
    const hit=geoHitPoint(p);
    if(hit&&S.geo.tool==='select'){
      act={type:'pt',name:hit,moved:0};
      requestDraw();
      return;
    }
  }
  if(S.tab==='three'){ act={type:'rot',x:p.x,y:p.y,az:S.three.az,pitch:S.three.pitch};return; }
  act={type:'pan',x:p.x,y:p.y,cx:S.view.cx,cy:S.view.cy,moved:0};
});

cv.addEventListener('pointermove',function(e){
  const p=loc(e);
  if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId,p);
  if(act&&act.type==='pinch'&&ptrs.size>=2){
    const arr=Array.from(ptrs.values());
    const d=dist(arr[0],arr[1]);
    const mid={x:(arr[0].x+arr[1].x)/2,y:(arr[0].y+arr[1].y)/2};
    const wx=act.cx0+(act.mid0.x-W/2)/act.u0;
    const wy=act.cy0-(act.mid0.y-H/2)/act.u0;
    S.view.unit=clamp(act.u0*(d/act.d0),1.2,80000);
    S.view.cx=wx-(mid.x-W/2)/S.view.unit;
    S.view.cy=wy+(mid.y-H/2)/S.view.unit;
    userView=true;
    requestDraw();
    return;
  }
  if(act&&act.type==='pan'){
    S.view.cx=act.cx-(p.x-act.x)/S.view.unit;
    S.view.cy=act.cy+(p.y-act.y)/S.view.unit;
    act.moved=Math.max(act.moved,dist(p,{x:act.x,y:act.y}));
    if(act.moved>4) userView=true;
    requestDraw();
    return;
  }
  if(act&&act.type==='rot'){
    S.three.az=act.az-(p.x-act.x)*0.011;
    S.three.pitch=clamp(act.pitch+(p.y-act.y)*0.007,0.03,1.56);
    requestDraw();
    return;
  }
  if(act&&act.type==='pt'){
    const o=S.geo.objs.filter(function(x){ return x.type==='point'&&x.name===act.name; })[0];
    if(o&&o.on){
      geoDragOnObj(o,p.x,p.y,geoSolve());
      act.moved=(act.moved||0)+1;
      requestDraw();
      return;
    }
    if(o&&!(o.dep&&o.dep.k==='mid')){
      o.x=worldX(p.x);o.y=worldY(p.y);
      act.moved=(act.moved||0)+1;
      requestDraw();
      return;
    }
    act={type:'pan',x:p.x,y:p.y,cx:S.view.cx,cy:S.view.cy,moved:0};
  }
  if(S.tab==='func'&&e.pointerType==='mouse'){
    S.hover={px:p.x,py:p.y};
    requestDraw();
    updateReadout();
  }
});

function endPointer(e){
  const was=act;
  ptrs.delete(e.pointerId);
  if(was&&was.type==='pt'){
    if(was.moved){ renderGeoRows(); commit(); }
  }
  if(was&&was.type==='pan'&&was.moved<6&&S.tab==='geo'){
    geoTap({x:was.x,y:was.y});
  }
  act=null;
  if(ptrs.size===1){
    const arr=Array.from(ptrs.values());
    act={type:'pan',x:arr[0].x,y:arr[0].y,cx:S.view.cx,cy:S.view.cy,moved:0};
  }
}
cv.addEventListener('pointerup',endPointer);
cv.addEventListener('pointercancel',function(e){
  ptrs.delete(e.pointerId);
  act=null;
});
cv.addEventListener('pointerleave',function(){
  if(act) return;
  S.hover=null;
  updateReadout();
  requestDraw();
});
cv.addEventListener('wheel',function(e){
  e.preventDefault();
  const p=loc(e);
  const dir=e.deltaY>0?-1:1;
  if(S.tab==='three'){
    S.three.scale=clamp(S.three.scale*(dir>0?1.09:1/1.09),0.45,4);
    requestDraw();
    return;
  }
  zoomAt(p.x,p.y,dir>0?1.12:1/1.12);
},{passive:false});

const WIN_KEY='fnplot.winsize';
let winCustom=false, winState=null;

function winClamp(w,h){
  const vw=window.innerWidth, vh=window.innerHeight;
  const minW=Math.min(340,vw), minH=Math.min(480,vh);
  const maxW=Math.max(minW,vw-14), maxH=Math.max(minH,vh-14);
  return {w:Math.round(clamp(w,minW,maxW)),h:Math.round(clamp(h,minH,maxH))};
}
function winApply(w,h,ox,oy,persist){
  const s=winClamp(w,h);
  const vw=window.innerWidth, vh=window.innerHeight;
  const lx=Math.max(0,(vw-s.w)/2-6), ly=Math.max(0,(vh-s.h)/2-6);
  const x=clamp(ox||0,-lx,lx), y=clamp(oy||0,-ly,ly);
  winCustom=true;
  winState={w:s.w,h:s.h,ox:x,oy:y};
  app.style.setProperty('--aw',s.w+'px');
  app.style.setProperty('--ah',s.h+'px');
  app.style.left=x+'px';
  app.style.top=y+'px';
  app.classList.add('is-win');
  syncHandles();
  requestDraw();
  if(persist){
    try{ localStorage.setItem(WIN_KEY,JSON.stringify(winState)); }catch(err){}
  }
  return winState;
}
function winReset(){
  winCustom=false;
  winState=null;
  app.style.removeProperty('--aw');
  app.style.removeProperty('--ah');
  app.style.left='';
  app.style.top='';
  app.classList.remove('is-win');
  try{ localStorage.removeItem(WIN_KEY); }catch(err){}
  syncHandles();
  requestDraw();
}
function syncHandles(){
  const on=winCustom||window.innerWidth>=640;
  app.classList.toggle('rz-on',on);
}
function restoreWinSize(){
  let saved=null;
  try{ saved=JSON.parse(localStorage.getItem(WIN_KEY)||'null'); }catch(err){ saved=null; }
  if(saved&&saved.w&&saved.h) winApply(saved.w,saved.h,saved.ox||0,saved.oy||0,false);
}
function bindResize(){
  Array.from(app.querySelectorAll('.rz')).forEach(function(handle){
    handle.addEventListener('pointerdown',function(e){
      if(e.pointerType==='mouse'&&e.button!==0) return;
      e.preventDefault();
      const dir=handle.dataset.dir;
      const r=app.getBoundingClientRect();
      const st={
        x:e.clientX,y:e.clientY,w:r.width,h:r.height,
        ox:parseFloat(app.style.left||'0')||0,
        oy:parseFloat(app.style.top||'0')||0
      };
      app.classList.add('is-win','resizing');
      winCustom=true;
      try{ handle.setPointerCapture(e.pointerId); }catch(err){}
      const onMove=function(ev){
        const dx=ev.clientX-st.x, dy=ev.clientY-st.y;
        let w=st.w, h=st.h;
        if(dir.indexOf('e')>=0) w=st.w+dx;
        if(dir.indexOf('w')>=0) w=st.w-dx;
        if(dir.indexOf('n')>=0) h=st.h-dy;
        if(dir.indexOf('s')>=0) h=st.h+dy;
        const s=winClamp(w,h);
        /* 保持被拖动的对边不动：东/南方向为正，西/北方向为负 */
        const sx=dir.indexOf('e')>=0?1:(dir.indexOf('w')>=0?-1:0);
        const sy=dir.indexOf('s')>=0?1:(dir.indexOf('n')>=0?-1:0);
        winApply(s.w,s.h,st.ox+sx*(s.w-st.w)/2,st.oy+sy*(s.h-st.h)/2,false);
      };
      const onUp=function(){
        handle.removeEventListener('pointermove',onMove);
        handle.removeEventListener('pointerup',onUp);
        handle.removeEventListener('pointercancel',onUp);
        app.classList.remove('resizing');
        const r2=app.getBoundingClientRect();
        try{
          localStorage.setItem(WIN_KEY,JSON.stringify({
            w:Math.round(r2.width),h:Math.round(r2.height),
            ox:parseFloat(app.style.left||'0')||0,
            oy:parseFloat(app.style.top||'0')||0
          }));
        }catch(err){}
      };
      handle.addEventListener('pointermove',onMove);
      handle.addEventListener('pointerup',onUp);
      handle.addEventListener('pointercancel',onUp);
    });
  });
  window.addEventListener('resize',function(){
    syncHandles();
    if(winCustom&&winState) winApply(winState.w,winState.h,winState.ox,winState.oy,false);
  });
}

/* ================= 启动 ================= */
function init(){
  buildLetters();
  bindKeys();
  bindUI();
  renderRows();
  refreshErrBar();
  commit();
  $('#caption').textContent=CAPTIONS.func;
  resize();
  restoreWinSize();
  requestDraw();
  bindResize();
  syncHandles();
  if(window.ResizeObserver){
    window.__ro=new ResizeObserver(function(){ requestDraw(); });
    window.__ro.observe($('#stage'));
  }
  window.addEventListener('resize',function(){ requestDraw(); });
  window.addEventListener('orientationchange',function(){ requestDraw(); });
}
init();
</script>

    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
